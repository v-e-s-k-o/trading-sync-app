/* Picking a day: the outline jumps to it and a ring ripples out from its roof — nothing moves */
function citySelect(date){
  if(date===city.selected) return;
  city.selected = date; cityTip(null);
  SFX.tick(); haptic('select');
  cityUpdate(); cityDayPanel();
  const g = city.nodes[date]; if(!g || reducedMotion()) return;
  city.sel.classList.remove('fc-sel-in'); void city.sel.getBoundingClientRect(); city.sel.classList.add('fc-sel-in');
  const ring = document.createElementNS(SVGNS, 'path');
  ring.setAttribute('class','fc-ping'); ring.setAttribute('d', city.sel.getAttribute('d'));
  g.appendChild(ring);
  ring.addEventListener('animationend', ()=> ring.remove());
}
function cityMoveDay(off){
  const idx = city.available.findIndex(b=>b.date===city.selected);
  const next = city.available[idx+off]; if(next) citySelect(next.date);
}
function cityTip(hover){
  const tip = document.getElementById('fcTip'); if(!tip) return;
  const nextHover = hover ? hover.date : null;
  if(nextHover !== city.hover){
    if(city.hover && city.nodes[city.hover]) city.nodes[city.hover].classList.remove('fc-hovered');
    city.hover = nextHover;
    if(nextHover && city.nodes[nextHover]) city.nodes[nextHover].classList.add('fc-hovered');
    if(city.progress < .5) cityUpdate();                     /* 2D: bring the hovered square to the front */
  }
  if(!hover){ tip.classList.add('hide'); return; }
  const b = city.blocks.find(x=>x.date===hover.date); if(!b) return;
  const info = b.info;
  if(tip.dataset.date !== b.date){
    tip.dataset.date = b.date;
    tip.innerHTML = `<span>${cDateLabel(b.date)}</span><strong>${info.count ? (info.wr===null ? 'Breakeven' : fmtPct0(info.wr)) : 'No trades'} ${info.count && info.wr!==null ? '<small>win rate</small>' : ''}</strong>${info.count ? `<small>${info.count} trade${info.count===1?'':'s'} · ${info.wins}W · ${info.losses}L</small>` : ''}`;
  }
  tip.style.transform = `translate(${hover.x}px, ${hover.y}px)`;
  tip.classList.remove('hide');
}
function cityBind(){
  const svg = document.getElementById('fcSvg'), plot = document.getElementById('fcPlot');
  document.querySelectorAll('#fcSwitch button').forEach(b=> b.onclick = ()=>{ if(city.view===b.dataset.v) return; SFX.tick(); haptic('select'); cityMorph(b.dataset.v); });
  const tipEl = document.getElementById('fcTip'); tipEl.style.left = '0px'; tipEl.style.top = '0px';
  const pos = (e)=>{
    const r = plot.getBoundingClientRect();
    return { x: Math.max(4, Math.min(city.width-164, e.clientX - r.left + 14)), y: Math.max(4, Math.min(city.height-74, e.clientY - r.top - 66)) };
  };
  /* In 2D the grid is regular, so the hovered day comes from the pointer position (not the swelling shape) */
  const gridHit = (e)=>{
    const r = svg.getBoundingClientRect(), sx = city.width / r.width;
    const x = (e.clientX - r.left)*sx, y = (e.clientY - r.top)*sx;
    const L = { cw:(city.width-8)/7, ch:(city.height-34)/city.rows };
    const col = Math.floor((x-4)/L.cw), row = Math.floor((y-30)/L.ch);
    const b = city.blocks.find(k=> k.column===col && k.row===row);
    return b && !b.future ? b.date : null;
  };
  const hitAt = (e)=>{
    if(city.progress < .5) return gridHit(e);
    const g = e.target.closest && e.target.closest('.fc-block');
    return g && !g.hasAttribute('data-future') ? g.dataset.date : null;
  };
  svg.addEventListener('pointerdown', (e)=>{
    if(city.view!=='city' || e.button!==0) return;
    city.drag = { start:e.clientX, yaw:city.yaw, moved:false };
    city.skipClick = false;
  });
  svg.addEventListener('pointermove', (e)=>{
    if(city.drag){
      const delta = e.clientX - city.drag.start;
      if(Math.abs(delta) > 4 && !city.drag.moved){
        city.drag.moved = true; plot.classList.add('fc-dragging'); cityTip(null);
        try{ svg.setPointerCapture(e.pointerId); }catch(_){}
      }
      if(city.drag.moved){ city.yaw = Math.max(.12, Math.min(1.3, city.drag.yaw + delta/420)); cityRequest(); return; }
    }
    if(e.pointerType==='touch') return;
    const d = hitAt(e);
    if(d) cityTip(Object.assign({ date:d }, pos(e))); else cityTip(null);
  });
  const endDrag = (cancel)=>{
    city.skipClick = cancel || !!(city.drag && city.drag.moved);
    if(city.drag && city.drag.moved) cityHint();
    city.drag = null; plot.classList.remove('fc-dragging');
  };
  svg.addEventListener('pointerup', ()=> endDrag(false));
  svg.addEventListener('pointercancel', ()=> endDrag(true));
  svg.addEventListener('pointerleave', ()=>{ cityTip(null); if(city.drag && !city.drag.moved) city.drag = null; });
  svg.addEventListener('click', (e)=>{
    const d = hitAt(e);
    if(d && !city.skipClick) citySelect(d);
    city.skipClick = false;
  });
  svg.addEventListener('dblclick', ()=>{ city.yaw = Math.PI/6; cityUpdate(); cityHint(); });
}

    URL.revokeObjectURL(url); SFX.success(); toast('Backup exported', 'ok');
  };
  document.getElementById('importJson').onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        if(!Array.isArray(parsed.trades)) throw new Error('bad format');
        if(!await confirmDialog({title:`Import ${parsed.trades.length} trades?`, message:'This will replace your current journal.', okText:'Import'})) return;
        state.trades = parsed.trades;
        if(parsed.settings) state.settings = Object.assign(state.settings, parsed.settings);
        await saveTrades(); await saveSettings(); applyTheme(state.settings.theme); render(); SFX.success(); haptic('success'); toast(`Imported ${parsed.trades.length} trades`, 'ok');
      }catch(err){ SFX.error(); haptic('error'); alertDialog('Could not read that file', 'Make sure it is a Futures Journal backup .json file.'); }
    };
    reader.readAsText(file);
  };
}

/* ============================= RULEBOOK ============================= */
/* A separate entity from the trade journal above: its own kv_store key, its own state.
   Nothing here reads or writes state.trades — deleting/importing trades never touches it. */
/* Synced to the same account database as trades, under its own kv_store key —
   a separate row ('rulebook'), so it never touches or overwrites trade data. */
let rulebookSaveQueue = Promise.resolve();
async function saveRulebook(){
  rulebookSaveQueue = rulebookSaveQueue.then(async ()=>{
    setSync('saving');
    const ok = await storageSet('rulebook', JSON.stringify(rb.rules));
    setSync(ok ? 'synced' : 'error');
    if(!ok) toast('Could not save — check your connection', 'err');
    return ok;
  });
  return rulebookSaveQueue;
}

function openRuleModal(id){

        <button class="btn-primary" id="rbModalSave">${existing?'Save changes':'Save rule'}</button>
      </div>
  `, '', { isDirty: ()=>formDirty });
  mountToggleRows(modal);
  modal.addEventListener('input', ()=>{ formDirty = true; });
  overlay.querySelectorAll('[data-rbtype]').forEach(b=>{
    b.onclick = ()=>{
      formDirty = true; typeVal = b.dataset.rbtype;

    const input = overlay.querySelector('#rbImgInput');
    if(input) input.onchange = async (e)=>{
      const file = e.target.files[0]; if(!file) return;
      try{ imgVal = await readImage(file); formDirty = true; refreshRbImg(); SFX.pop(); haptic('light'); }
      catch(err){ SFX.error(); alertDialog('Could not read that image', 'Try a different file.'); }
    };
    const rm = overlay.querySelector('#rbImgRemove');

  function refreshRbImg(){

  document.getElementById('rbModalClose').onclick = requestClose;
  document.getElementById('rbModalCancel').onclick = requestClose;

    await saveRulebook();
    toast(existing ? 'Rule updated' : 'Rule saved', 'ok');

  modal.addEventListener('keydown', (e)=>{ if((e.metaKey||e.ctrlKey) && e.key==='Enter'){ e.preventDefault(); document.getElementById('rbModalSave').click(); } });
  setTimeout(()=>{ if(!isMobile()){ const first = modal.querySelector('#rbTitle'); if(first) first.focus({preventScroll:true}); } }, 300);

/* ============================= FADE JOURNAL =============================
   Trades you wanted to take but didn't. Date + notes, nothing else.
   Stored in its own kv_store row ('fade') — never touches trades, settings, rulebook. */
let fd = { items: [], search: '', editing: null, draft: {}, editImgs: {}, draftResult: '', editResult: '' };
function fdResultHtml(scope, val){
  return `<div class="form-field" style="margin:0;"><label>Result</label><div class="fd-result" data-fdresult="${scope}"><button type="button" class="win${val==='win'?' active':''}" data-fdres="win">Win</button><button type="button" class="loss${val==='loss'?' active':''}" data-fdres="loss">Loss</button></div></div>`;
}
function onFadeResultClick(e){
  const b = e.target.closest && e.target.closest('[data-fdres]'); if(!b) return false;
  const grp = b.closest('[data-fdresult]'), scope = grp.dataset.fdresult, v = b.dataset.fdres;
  const cur = scope==='c' ? fd.draftResult : fd.editResult;
  const next = cur===v ? '' : v;   // click the active one again to clear
  if(scope==='c') fd.draftResult = next; else fd.editResult = next;
  grp.querySelectorAll('button').forEach(x=>x.classList.toggle('active', x.dataset.fdres===next));
  SFX.pop(); haptic('light');

}
let fadeSaveQueue = Promise.resolve();
async function saveFade(){
  fadeSaveQueue = fadeSaveQueue.then(async ()=>{
    setSync('saving');
    const ok = await storageSet('fade', JSON.stringify(fd.items));
    setSync(ok ? 'synced' : 'error');
    if(!ok) toast('Could not save — check your connection', 'err');
    return ok;
  });
  return fadeSaveQueue;
}
function fid(){ return 'f_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function localISO(d){ d = d || new Date(); const p = n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function fmtFadeDate(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); if(!m) return iso || '';
  return new Date(+m[1], +m[2]-1, +m[3]).toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric', year:'numeric'});
}
function updateFadeCount(){
  const el = document.getElementById('fdCount'); if(!el) return;

/* Chart screenshots for fade entries — same three slots / same image handling as the trade log */
function fdSlotHtml(scope, key, label, dataUrl){

  return `
    <div class="img-slot" data-fdslot="${sk}">
      <div class="img-slot-label">${label}</div>

}
function fdSlotsRow(scope, imgs){
  return `<div class="form-field span2" style="margin:0;"><label>Chart screenshots</label><div class="img-upload-row">${TF_SLOTS.map(s=>fdSlotHtml(scope, s.key, s.label, imgs[s.key])).join('')}</div></div>`;
}
function fdImgStore(scope){ return scope==='c' ? fd.draft : fd.editImgs; }
function fdRefreshSlot(scope, key){
  const sk = scope + '|' + key;
  const el = document.querySelector(`[data-fdslot="${sk}"]`); if(!el) return;
  const slot = TF_SLOTS.find(s=>s.key===key);
  el.outerHTML = fdSlotHtml(scope, key, slot.label, fdImgStore(scope)[key]);
}
function onFadeImgEvent(e){
  const inp = e.target.closest && e.target.closest('[data-fdimg]');
  if(e.type==='change' && inp){
    const file = inp.files[0]; if(!file) return;
    const [scope, key] = inp.dataset.fdimg.split('|');
    readImage(file).then(url=>{ fdImgStore(scope)[key] = url; fdRefreshSlot(scope, key); SFX.pop(); haptic('light'); })
      .catch(()=>{ SFX.error(); alertDialog('Could not read that image', 'Try a different file.'); });
    return true;
  }
  if(e.type==='click'){
    const rm = e.target.closest('[data-fdimgrm]');
    if(rm){ const [scope, key] = rm.dataset.fdimgrm.split('|'); fdImgStore(scope)[key] = null; fdRefreshSlot(scope, key); SFX.swoosh(); return true; }
    const th = e.target.closest('[data-fdview]');
    if(th){ const [scope, key] = th.dataset.fdview.split('|'); openImageLightbox(fdImgStore(scope)[key]); return true; }
  }
}

function renderFadeList(){

function onFadeListClick(e){
  const ed = e.target.closest('[data-fdedit]'), del = e.target.closest('[data-fddel]'), sv = e.target.closest('[data-fdsave]'), cn = e.target.closest('[data-fdcancel]');
  if(onFadeImgEvent(e)) return;
  if(onFadeResultClick(e)) return;
  if(!ed && !del && !sv && !cn){
    const dth = e.target.closest('.detail-img-thumb');
    if(dth){ openImageLightbox(dth.src); }
    return;
  }
  if(ed){
    fd.editing = ed.dataset.fdedit;
    const it = fd.items.find(x=>x.id===fd.editing) || {};
    fd.editResult = it.result || '';
    fd.editImgs = {}; TF_SLOTS.forEach(s=>{ if(it[s.key]) fd.editImgs[s.key] = it[s.key]; });
    renderFadeList(); return;
  }
  if(cn){ fd.editing = null; fd.editImgs = {}; renderFadeList(); return; }
  if(sv){
    const item = fd.items.find(x=>x.id===sv.dataset.fdsave); if(!item) return;
    const card = sv.closest('.fd-card');
    const notes = card.querySelector('[data-fdedit-notes]').value.trim();
    if(!notes){ SFX.error(); toast('Notes can’t be empty', 'err'); return; }
    item.notes = notes; item.date = card.querySelector('[data-fdedit-date]').value || item.date;
    if(fd.editResult) item.result = fd.editResult; else delete item.result;
    TF_SLOTS.forEach(s=>{ if(fd.editImgs[s.key]) item[s.key] = fd.editImgs[s.key]; else delete item[s.key]; });
    fd.editImgs = {};
    fd.editing = null; SFX.success(); haptic('success'); renderFadeList();
    saveFade().then(()=>toast('Entry updated', 'ok'));
    return;
  }
  if(del){
    const id = del.dataset.fddel;
    confirmDialog({title:'Delete this entry?', message:'This permanently removes it from your fade journal.', okText:'Delete', danger:true}).then(async ok=>{
      if(!ok) return;
      fd.items = fd.items.filter(x=>x.id!==id);
      SFX.del(); haptic('heavy'); renderFadeList(); updateFadeCount();
      await saveFade(); toast('Entry deleted', 'warn');
    });
  }
}

/* ============================= NOTEBOOK =============================
   One endless rich-text page: type, format, drop images between paragraphs.
   Stored as HTML in its own kv_store row ('notebook'). */
let nb = { html: '', lastSaved: '' };
let nbTimer = null, nbSaveQueue = Promise.resolve(), nbRange = null, nbPendingSize = 16;
function sanitizeDoc(html){
  if(!html) return '';
  try{
    const doc = new DOMParser().parseFromString('<body>'+html+'</body>', 'text/html');
    doc.body.querySelectorAll('script,iframe,object,embed,style,link,meta,form,base').forEach(n=>n.remove());
    doc.body.querySelectorAll('*').forEach(n=>{
      [...n.attributes].forEach(a=>{
        const nm = a.name.toLowerCase(), v = (a.value||'').trim().toLowerCase();
        if(nm.startsWith('on') || ((nm==='href'||nm==='src'||nm==='xlink:href') && v.startsWith('javascript:'))) n.removeAttribute(a.name);
      });
    });
    return doc.body.innerHTML;
  }catch(e){ return ''; }
}
async function saveNotebook(){
  nbSaveQueue = nbSaveQueue.then(async ()=>{
    setSync('saving');
    const value = nb.html; nb.lastSaved = value;
    const ok = await storageSet('notebook', value);
    setSync(ok ? 'synced' : 'error');
    if(!ok) toast('Could not save notebook — check your connection', 'err');
    return ok;
  });
  return nbSaveQueue;
}
function nbFlush(){ if(nbTimer){ clearTimeout(nbTimer); nbTimer = null; saveNotebook(); } }
window.addEventListener('pagehide', nbFlush);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') nbFlush(); });
document.addEventListener('selectionchange', ()=>{
  const ed = document.getElementById('nbDoc'); if(!ed) return;
  const s = window.getSelection();
  if(s.rangeCount && ed.contains(s.anchorNode)){ nbRange = s.getRangeAt(0).cloneRange(); updateNbToolbar(); }
});
function updateNbToolbar(){
  document.querySelectorAll('.nb-btn[data-state]').forEach(b=>{
    let on = false; try{ on = document.queryCommandState(b.dataset.state); }catch(e){}
    b.classList.toggle('active', !!on);
  });
}
function nbRestore(){
  const ed = document.getElementById('nbDoc'); if(!ed) return null;
  ed.focus({preventScroll:true});
  const s = window.getSelection();
  if(nbRange && ed.contains(nbRange.startContainer)){ s.removeAllRanges(); s.addRange(nbRange); }
  else { const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); s.removeAllRanges(); s.addRange(r); }
  return ed;
}
function nbOnInput(){
  const ed = document.getElementById('nbDoc'); if(!ed) return;
  /* turn legacy <font size=7> (from the size picker) into real pixel sizes */
  ed.querySelectorAll('font[size="7"]').forEach(f=>{
    const sp = document.createElement('span'); sp.style.fontSize = nbPendingSize + 'px';
    while(f.firstChild) sp.appendChild(f.firstChild);
    f.replaceWith(sp);
  });
  if(!ed.textContent.trim() && !ed.querySelector('img,ul,ol')) ed.innerHTML = '';
  nb.html = ed.innerHTML;
  clearTimeout(nbTimer);
  nbTimer = setTimeout(()=>{ nbTimer = null; saveNotebook(); }, 900);
}
function nbExec(cmd, val){
  const ed = nbRestore(); if(!ed) return;
  document.execCommand('styleWithCSS', false, true);
  document.execCommand(cmd, false, val);
  nbOnInput(); updateNbToolbar();
}
function nbSetSize(px){
  const ed = nbRestore(); if(!ed) return;
  nbPendingSize = px;
  document.execCommand('styleWithCSS', false, false);
  document.execCommand('fontSize', false, '7');
  document.execCommand('styleWithCSS', false, true);
  nbOnInput();
}
function readImageSized(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
        const sc = Math.min(1, maxDim / Math.max(W, H));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(W*sc)); c.height = Math.max(1, Math.round(H*sc));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('bad image'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}
async function nbInsertImages(files){
  const imgs = [...files].filter(f=>/^image\//.test(f.type));
  if(!imgs.length) return;
  for(const f of imgs){
    try{
      const url = await readImageSized(f, 1800, 0.82);
      const ed = nbRestore(); if(!ed) return;
      document.execCommand('insertHTML', false, '<div><img src="'+url+'"></div><div><br></div>');
      nbOnInput();
    }catch(err){ SFX.error(); alertDialog('Could not read that image', 'Try a different file.'); }
  }
  SFX.pop(); haptic('light');
}

        ${B('justifyRight','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M4 6h16M10 12h10M6 18h14"/></svg>','Align right','justifyRight')}

  ed.innerHTML = nb.html;
  ed.addEventListener('input', nbOnInput);
  ed.addEventListener('blur', nbFlush);
  ed.addEventListener('keyup', updateNbToolbar);
  ed.addEventListener('click', (e)=>{
    if(e.target.tagName==='IMG'){ const r = document.createRange(); r.selectNode(e.target); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
  });
  ed.addEventListener('dblclick', (e)=>{ if(e.target.tagName==='IMG') openImageLightbox(e.target.src); });
  ed.addEventListener('paste', (e)=>{
    const cd = e.clipboardData; if(!cd) return;
    const files = [...(cd.files||[])].filter(f=>/^image\//.test(f.type));

  ed.addEventListener('drop', (e)=>{

  bg.oninput = ()=>{ document.getElementById('nbBgSw').style.background = bg.value; };

  bg.onchange = ()=>{ nbExec('hiliteColor', bg.value); };
  document.getElementById('nbImgInput').onchange = (e)=>{ nbInsertImages(e.target.files); e.target.value = ''; };
}

/* The things the trader must not forget. Any number of entries, shown on the Dashboard.
   Stored in its own kv_store row ('reminders') — never touches trades, settings or the rulebook. */
let remState = { items: [] };
let remindersSaveQueue = Promise.resolve();
function remuid(){ return 'm_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
async function saveReminders(){
  remindersSaveQueue = remindersSaveQueue.then(async ()=>{
    setSync('saving');
    const ok = await storageSet('reminders', JSON.stringify(remState.items));
    setSync(ok ? 'synced' : 'error');
    if(!ok) toast('Could not save — check your connection', 'err');

  });

}
function renderRemindersPanel(){

}
function bindReminders(root){
  const add = root.querySelector('#remAddBtn'); if(add) add.onclick = ()=>{ SFX.pop(); haptic('light'); openReminderModal(); };
  root.querySelectorAll('[data-editrem]').forEach(el=> el.onclick = ()=> openReminderModal(el.dataset.editrem));
  root.querySelectorAll('[data-delrem]').forEach(el=> el.onclick = ()=> deleteReminder(el.dataset.delrem));
}
function deleteReminder(id){
  confirmDialog({title:'Delete this reminder?', message:'This permanently removes it.', okText:'Delete', danger:true}).then(async ok=>{
    if(!ok) return;
    remState.items = remState.items.filter(m=>m.id!==id);
    SFX.del(); haptic('heavy'); renderMain();
    await saveReminders();
    toast('Reminder deleted', 'warn');
  });
}
function openReminderModal(id){
  const existing = id ? remState.items.find(m=>m.id===id) : null;
  let formDirty = false;
  const { overlay, modal, close, requestClose } = makeOverlay(`
      <div class="modal-head"><h2>${existing?'Edit reminder':'New reminder'}</h2><button class="close-x" id="remModalClose" aria-label="Close">${ICONS.x}</button></div>
      <div class="form-grid">
        <div class="form-field span2"><label>What do you need to remember?</label><textarea id="remText" rows="4" placeholder="e.g. No revenge trades after a loss">${existing?escapeHtml(existing.text):''}</textarea></div>
      </div>
      <div class="modal-foot">
        <button class="btn-secondary" id="remModalCancel">Cancel</button>
        <button class="btn-primary" id="remModalSave">${existing?'Save changes':'Save reminder'}</button>
      </div>
  `, '', { isDirty: ()=>formDirty });
  modal.addEventListener('input', ()=>{ formDirty = true; });
  document.getElementById('remModalClose').onclick = requestClose;
  document.getElementById('remModalCancel').onclick = requestClose;
  document.getElementById('remModalSave').onclick = async ()=>{
    const f = document.getElementById('remText');
    const text = f.value.trim();
    if(!text){ SFX.error(); haptic('error'); f.classList.add('shake'); f.focus(); setTimeout(()=>f.classList.remove('shake'),500); toast('Write something to remember', 'err'); return; }
    if(existing){ existing.text = text; }
    else { remState.items.push({ id: remuid(), text, created: Date.now() }); }
    SFX.success(); haptic('success'); close(); renderMain();
    await saveReminders();
    toast(existing ? 'Reminder updated' : 'Reminder saved', 'ok');
  };
  modal.addEventListener('keydown', (e)=>{ if((e.metaKey||e.ctrlKey) && e.key==='Enter'){ e.preventDefault(); document.getElementById('remModalSave').click(); } });
  setTimeout(()=>{ if(!isMobile()){ const first = modal.querySelector('#remText'); if(first) first.focus({preventScroll:true}); } }, 300);
}

/* ============================= MODAL: ADD / EDIT TRADE ============================= */
/* One image per screenshot slot: a single high-quality copy stored with the trade (no separate thumbnail). */
const IMG_MAX_DIM = 2560;     /* longest side in px — raise this for more detail, lower it for a lighter journal */
const IMG_QUALITY = 0.85;     /* JPEG quality */
function readImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
        const sc = Math.min(1, IMG_MAX_DIM / Math.max(W, H));
        const w = Math.max(1, Math.round(W*sc)), h = Math.max(1, Math.round(H*sc));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        let out = c.toDataURL('image/jpeg', IMG_QUALITY);
        if(out.length > 4000000) out = c.toDataURL('image/jpeg', 0.72);   /* rare: very detailed images */
        resolve(out);
      };
      img.onerror = ()=>reject(new Error('bad image'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}

        <div class="form-field span2"><label>Notes</label><textarea id="fNotes" rows="3" placeholder="Describe the setup, execution, what went right or wrong…">${escapeHtml(t.notes||'')}</textarea></div>
        <div class="form-field span2"><label>Chart screenshots</label><div class="img-upload-row">${TF_SLOTS.map(s=>imgSlotHtml(s.key, s.label, imgState[s.key])).join('')}</div></div>
        <div class="form-preview" id="livePreview"></div>
      </div>
      <div class="modal-foot">
        <button class="btn-secondary" id="modalCancel">Cancel</button>
        <button class="btn-primary" id="modalSave">${existing?'Save changes':'Log trade'}</button>
      </div>
  `, '', { isDirty: ()=>formDirty });
  mountToggleRows(modal);
  modal.addEventListener('input', ()=>{ formDirty = true; });
  modal.addEventListener('change', ()=>{ formDirty = true; });

  let dirVal = t.direction, jTypeVal = jType, demoVal = t.demo || 'no', po3UsedVal = t.po3Used || 'yes';
  const bindToggle = (attr, setter, after)=>{
    overlay.querySelectorAll(`[data-${attr}]`).forEach(b=>{
      b.onclick = ()=>{
        formDirty = true;
        setter(b.dataset[attr]);
        const row = b.closest('.toggle-row');
        row.querySelectorAll('.toggle-btn').forEach(x=>x.classList.toggle('active', x===b));
        if(row._place) row._place(true);
        SFX.toggle(); haptic('select');
        if(after) after();
      };
    });
  };
  bindToggle('dir', v=>dirVal=v, updatePreview);
  bindToggle('jtype', v=>jTypeVal=v, ()=>{ document.getElementById('demoFieldWrap').style.display = jTypeVal==='backtest' ? 'none' : ''; });
  bindToggle('demo', v=>demoVal=v);
  bindToggle('po3used', v=>po3UsedVal=v, ()=>{ document.getElementById('po3FieldWrap').style.display = po3UsedVal==='no' ? 'none' : ''; });

  function bindImgSlot(key, label){
    overlay.querySelectorAll(`[data-imginput="${key}"]`).forEach(input=>{
      input.onchange = async (e)=>{
        const file = e.target.files[0]; if(!file) return;
        try{ imgState[key] = await readImage(file); touched[key] = true; formDirty = true; refreshImgSlot(key, label); SFX.pop(); haptic('light'); }
        catch(err){ SFX.error(); alertDialog('Could not read that image', 'Try a different file.'); }
      };
    });
    const rm = overlay.querySelector(`[data-imgremove="${key}"]`);
    if(rm) rm.onclick = ()=>{ imgState[key] = null; touched[key] = true; formDirty = true; refreshImgSlot(key, label); SFX.swoosh(); };
    const thumb = overlay.querySelector(`.img-slot-thumb[data-view="${key}"]`);
    if(thumb) thumb.onclick = ()=>{
      /* legacy two-copy image that has not been merged yet: the viewer can still fetch its sharp copy */
      if(!touched[key] && existing && existing.fullImgs && existing.fullImgs[key]) openImageLightbox(imgState[key], { tradeId: existing.id, key });
      else openImageLightbox(imgState[key]);
    };
  }
  function refreshImgSlot(key, label){
    const el = document.getElementById('imgSlot_'+key);
    if(el) el.outerHTML = imgSlotHtml(key, label, imgState[key]);
    bindImgSlot(key, label);
  }
  TF_SLOTS.forEach(s=> bindImgSlot(s.key, s.label));

  function updateDowHint(){ const dv = document.getElementById('fDate').value; document.getElementById('dowHint').textContent = dv ? DOW[dayOfWeek(dv)] : ''; }
  function updatePreview(){
    let rrv = parseFloat(document.getElementById('fRR').value); if(!rrv || rrv<0.01) rrv = 0.01;
    const draft = { outcome: document.getElementById('fOutcomeM').value, rr: rrv };
    const r = rMultiple(draft), oc = outcomeClass(draft);
    const dv = document.getElementById('fDate').value;
    document.getElementById('livePreview').innerHTML = `
      <div class="fp-item"><div class="fp-lbl">Result</div><div class="fp-val num ${outClassColor(oc)}">${fmtR(r)}</div></div>
      <div class="fp-item"><div class="fp-lbl">Win rate</div><div class="fp-val ${oc==='be'?'neu':outClassColor(oc)}">${oc==='be' ? 'Not counted' : oc==='win' ? 'Counts as a win' : 'Counts as a loss'}</div></div>
      <div class="fp-item"><div class="fp-lbl">Day of week</div><div class="fp-val">${dv ? DOW[dayOfWeek(dv)] : '—'}</div></div>
      <div class="fp-item"><div class="fp-lbl">Direction</div><div class="fp-val ${dirVal==='long'?'pos':'neg'}">${dirVal==='long'?'▲ Long':'▼ Short'}</div></div>
    `;
  }
  updateDowHint(); updatePreview();
  document.getElementById('fDate').oninput = ()=>{ updateDowHint(); updatePreview(); };
  document.getElementById('fOutcomeM').onchange = ()=>{ updatePreview(); SFX.tick(); };
  document.getElementById('fRR').oninput = updatePreview;

  document.getElementById('modalClose').onclick = requestClose;
  document.getElementById('modalCancel').onclick = requestClose;
  modal.addEventListener('keydown', (e)=>{ if((e.metaKey||e.ctrlKey) && e.key==='Enter'){ e.preventDefault(); document.getElementById('modalSave').click(); } });
  document.getElementById('modalSave').onclick = async ()=>{
    const dateVal = document.getElementById('fDate').value;
    if(!dateVal){ SFX.error(); haptic('error'); const f0 = document.getElementById('fDate'), f = f0._csBtn || f0; f.classList.add('shake'); f.focus(); setTimeout(()=>f.classList.remove('shake'),500); toast('Please select a date', 'err'); return; }
    let rrVal = parseFloat(document.getElementById('fRR').value); if(!rrVal || rrVal < 0.01) rrVal = 0.01;
    const outcomeVal = document.getElementById('fOutcomeM').value;
    /* Start from the stored trade so fields that are no longer shown (old risk / breakeven-$ values) are kept untouched. */
    const record = Object.assign({}, existing || {}, {
      id: existing ? existing.id : uid(),
      created: existing ? loggedAt(existing) || Date.now() : Date.now(),
      date: dateVal,
      time: (()=>{ const h=document.getElementById('fTimeHour').value, mn=document.getElementById('fTimeMinute').value; return (h && mn) ? `${h}:${mn}` : ''; })(),
      symbol: document.getElementById('fSymbolM').value,
      journalType: jTypeVal,
      demo: jTypeVal==='backtest' ? 'no' : demoVal,
      rating: document.getElementById('fRating').value,
      direction: dirVal,
      po3Used: po3UsedVal,
      po3: po3UsedVal==='no' ? 'Not used' : document.getElementById('fPo3').value,
      model: document.getElementById('fModelM').value,
      entryTf: document.getElementById('fEntryTf').value,
      rr: rrVal,
      outcome: outcomeVal,
      dol: document.getElementById('fDol').value,
      notes: document.getElementById('fNotes').value.trim(),
      imgLow: imgState.imgLow, imgMid: imgState.imgMid, imgHigh: imgState.imgHigh,
    });
    delete record.fullImgs;
    /* Only relevant for older two-copy images that have not been merged yet: keep their flag if untouched. */
    const legacy = {}, staleKeys = [];
    TF_SLOTS.forEach(sl=>{
      const k = sl.key, had = !!(existing && existing.fullImgs && existing.fullImgs[k]);
      if(!had) return;
      if(touched[k]) staleKeys.push(k); else if(imgState[k]) legacy[k] = true;
    });
    if(Object.keys(legacy).length) record.fullImgs = legacy;
    if(existing){ const idx = state.trades.findIndex(x=>x.id===existing.id); state.trades[idx] = record; }
    else { state.trades.push(record); }
    const journalChanged = record.journalType !== state.journal;
    if(journalChanged){ state.journal = record.journalType; state.settings.lastJournal = record.journalType; }
    const r = rMultiple(record), oc = outcomeClass(record);
    if(oc==='win'){ SFX.win(); haptic('success'); } else if(oc==='loss'){ SFX.lossSave(); haptic('medium'); } else { SFX.success(); haptic('success'); }
    close();
    renderMain();
    saveTrades();
    if(journalChanged) saveSettings();
    toast(existing ? 'Trade updated' : `Trade logged · ${outcomeMeta(record.outcome).label} · ${fmtR(r)}`, oc==='loss' ? 'info' : 'ok');
    staleKeys.forEach(k=> storageDelete(fullImgKey(record.id, k)));
  };
  setTimeout(()=>{ if(!isMobile()){ const first = modal.querySelector('#fDate'); if(first) first.focus({preventScroll:true}); } }, 300);
}

/* ============================= MODAL: TRADE DETAIL ============================= */
function detailItem(label, val){ return `<div class="detail-item"><div class="detail-item-lbl">${label}</div><div class="detail-item-val">${val}</div></div>`; }
function detailImgCard(label, src, key){
  if(!src) return `<div class="detail-img-card"><div class="detail-img-lbl">${label}</div><div class="img-slot-empty" style="height:80px;">${ICONS.image}<span>No image</span></div></div>`;
  return `<div class="detail-img-card"><div class="detail-img-lbl">${label}</div><img src="${src}" class="detail-img-thumb" data-key="${key}"></div>`;
}
function openTradeDetail(id){
  const raw = state.trades.find(x=>x.id===id);
  if(!raw) return;
  const t = withDerived(raw);
  const om = outcomeMeta(t.outcome);
  const { overlay, modal, close } = makeOverlay(`
      <div class="modal-head"><h2>${t.symbol} <span style="color:var(--text-3);font-weight:600;">· ${shortDate(t.date)}</span></h2><button class="close-x" id="detailClose" aria-label="Close">${ICONS.x}</button></div>
      <div class="detail-hero">
        <div>
          <div class="dh-pnl num ${outClassColor(t.outClass)}">${fmtR(t.r)}</div>
          <div class="dh-sub">${prettyDate(t.date)}${t.time?` · ${t.time} ET`:''} · ${t.outClass==='be' ? 'not counted in win rate' : t.outClass==='win' ? 'counted as a win' : 'counted as a loss'}</div>
        </div>
        <div class="dh-badges">
          <span class="badge ${t.direction}">${t.direction==='long'?'▲ Long':'▼ Short'}</span>
          <span class="badge ${om.class}">${om.label}</span>
          <span class="badge ${ratingClass(t.rating)}">${t.rating}</span>
          ${t.journalType==='live' ? `<span class="badge ${t.demo==='yes'?'demo':'real'}">${t.demo==='yes'?'Demo':'Real'}</span>` : `<span class="badge journal-backtest">Backtest</span>`}
        </div>
      </div>
      <div class="detail-grid">
        ${detailItem('Journal', JOURNAL_LABELS[t.journalType])}
        ${detailItem('Model', t.model)}
        ${detailItem('PO3', t.po3)}
        ${detailItem('Entry timeframe', t.entryTf)}
        ${detailItem('Risk : Reward', rrLabel(t.rr))}
        ${detailItem('Draw on liquidity', escapeHtml(t.dol||'—'))}
        ${detailItem('Day of week', DOW[t.dow])}
      </div>
      <div class="detail-block"><div class="detail-block-lbl">Notes</div><div class="detail-block-text">${escapeHtml(t.notes||'—')}</div></div>
      <div class="detail-block"><div class="detail-block-lbl">Chart screenshots</div><div class="detail-imgs">${TF_SLOTS.map(s=>detailImgCard(s.label, t[s.key], s.key)).join('')}</div></div>
      <div class="modal-foot">
        <button class="btn-ghost btn-danger" id="detailDeleteBtn" style="margin-right:auto;">${ICONS.trash.replace('<svg','<svg width="14" height="14"')} Delete</button>
        <button class="btn-secondary" id="detailCloseBtn">Close</button>
        <button class="btn-primary" id="detailEditBtn">${ICONS.edit.replace('<svg','<svg width="14" height="14"')} Edit</button>
      </div>
  `, 'detail-modal');
  document.getElementById('detailClose').onclick = close;
  document.getElementById('detailCloseBtn').onclick = close;
  document.getElementById('detailEditBtn').onclick = ()=>{ close(); setTimeout(()=>openTradeModal(id), 120); };
  document.getElementById('detailDeleteBtn').onclick = async ()=>{ close(); await new Promise(r=>setTimeout(r,150)); deleteTrade(id); };
  overlay.querySelectorAll('.detail-img-thumb').forEach(img=>{ img.onclick = ()=>{ const k = img.dataset.key; openImageLightbox(img.src, (t.fullImgs && t.fullImgs[k]) ? { tradeId: id, key: k } : undefined); }; });
}

/* ============================= INIT ============================= */
(async function init(){
  const sub = document.getElementById('splashSub');
  try{
    await ensureAuth();
    if(sub) sub.textContent = 'Syncing your trades…';
    await loadData();
    render();
    subscribeRealtime();
    hideSplash();
    setTimeout(async ()=>{ await migrateLegacyFullImages(); await cleanupOrphanFullImages(); }, 4000);
    let lastMobile = isMobile();
    window.addEventListener('resize', ()=>{ const m = isMobile(); if(m!==lastMobile){ lastMobile = m; renderMain(); } });
    if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
  }catch(e){
    console.error(e);
    if(sub) sub.textContent = 'Something went wrong loading the journal. Refresh to try again.';
  }
})();
</script>
