/* ============================= THEME ============================= */
/* A theme change is pure CSS: every colour token is a registered @property that transitions on <html>.
   Canvas layers (Chart.js + the X-mark backdrop) can't read CSS, so a short rAF loop repaints them
   with the live token values while the fade runs. */
const THEME_MS = 520;
let __themeUntil = 0, __themeRaf = 0;

function retintCharts(){
  if(!window.Chart) return;
  const keys = Object.keys(charts);
  if(!keys.length) return;
  chartDefaults();
  const P = pal();
  keys.forEach(k=>{
    const ch = charts[k]; if(!ch || !ch.data || !ch.data.datasets[0]) return;
    const ds = ch.data.datasets[0];
    if(ch.config.type==='doughnut'){
      const dc = donutColors(k); ds.backgroundColor = dc.solid; ds.hoverBackgroundColor = dc.solid; ds.gradPairs = dc.pairs; syncDonutLegend(ch);
    }
    const sc = ch.options && ch.options.scales;
    if(sc){
      if(sc.x && sc.x.ticks) sc.x.ticks.color = P.text3;
      if(sc.y){ if(sc.y.ticks) sc.y.ticks.color = P.text3; if(sc.y.grid) sc.y.grid.color = P.sep; }
    }
    ch.update('none');
  });
}
function themeSyncFrame(){
  __themeRaf = 0;
  invalidatePal();
  retintCharts();
  if(window.__bgRedraw) window.__bgRedraw();
  if(performance.now() < __themeUntil) __themeRaf = requestAnimationFrame(themeSyncFrame);
  else document.documentElement.classList.remove('theme-switching');
}
function applyTheme(theme){
  const t = theme==='dark' ? 'dark' : 'light';
  const root = document.documentElement;
  const changed = root.getAttribute('data-theme') !== t;
  const animate = changed && state.loaded && !reducedMotion();
  if(animate) root.classList.add('theme-switching');
  root.setAttribute('data-theme', t);
  try{ localStorage.setItem('fj:settings', JSON.stringify({ theme: t })); }catch(e){}
  const meta = document.querySelector('meta[name="theme-color"]:not([media])') || (()=>{ const m=document.createElement('meta'); m.name='theme-color'; document.head.appendChild(m); return m; })();
  meta.content = t==='dark' ? '#0d1016' : '#e9edf4';
  renderShellState();
  if(!changed) return;
  __themeUntil = performance.now() + (animate ? THEME_MS + 140 : 0);
  if(!__themeRaf) __themeRaf = requestAnimationFrame(themeSyncFrame);
}

/* ============================= CURSOR SPOTLIGHT + X-MARK FIELD ============================= */
/* Two things follow the pointer, sharing one smoothed position:
   - #cursor-glow : a soft blue radial wash (radius = --glow-r)
   - #bg-x canvas : the faint grid of X marks. Marks within --x-radius of the cursor ease up to "lit":
                    they grow, brighten and spin a quarter-turn, each easing on its own so a trail follows.
   Both fade back after ~2.2s idle. Touch devices get the static grid. */
(function initBackdrop(){
  const cv = document.getElementById('bg-x'); if(!cv) return;
  const ctx = cv.getContext('2d');
  const glow = document.getElementById('cursor-glow');
  const hoverCapable = !window.matchMedia('(hover: none)').matches;
  const rmq = window.matchMedia('(prefers-reduced-motion: reduce)');
  const CELL = 56, OFF = 28, HALF = 6, ACTIVE = .004;
  let R = 250;
  let W = 0, H = 0, dpr = 1, cols = 0, rows = 0, infl = new Float32Array(0);
  let colBase = 'rgba(120,170,255,.10)', colLit = 'rgba(120,185,255,.85)';
  let tx = -600, ty = -600, cx = -600, cy = -600;
  let seen = false, lit = false, idleT = null, raf = 0, last = 0;

  function readColors(){
    const cs = getComputedStyle(document.documentElement);
    const b = cs.getPropertyValue('--x-base').trim(), l = cs.getPropertyValue('--x-lit').trim();
    if(b) colBase = b; if(l) colLit = l;
    const r = parseFloat(cs.getPropertyValue('--x-radius')); if(r > 0) R = r;
  }
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cols = Math.ceil(W / CELL) + 1; rows = Math.ceil(H / CELL) + 1;
    infl = new Float32Array(cols * rows);
    readColors(); drawFrame();
  }
  function xPath(x, y, h){ ctx.moveTo(x-h, y-h); ctx.lineTo(x+h, y+h); ctx.moveTo(x+h, y-h); ctx.lineTo(x-h, y+h); }
  function drawFrame(){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = 'round';
    ctx.globalAlpha = 1; ctx.strokeStyle = colBase; ctx.lineWidth = 1;
    ctx.beginPath();
    let any = false;
    for(let j=0; j<rows; j++){
      const y = OFF + j*CELL;
      for(let i=0; i<cols; i++){
        if(infl[j*cols+i] >= ACTIVE){ any = true; continue; }
        xPath(OFF + i*CELL, y, HALF);
      }
    }
    ctx.stroke();
    if(!any) return;
    const still = rmq.matches;
    for(let j=0; j<rows; j++){
      for(let i=0; i<cols; i++){
        const s = infl[j*cols+i]; if(s < ACTIVE) continue;
        const e = s*s*(3-2*s);
        ctx.save();
        ctx.translate(OFF + i*CELL, OFF + j*CELL);
        if(!still) ctx.rotate(e * Math.PI * .5);
        const h = still ? HALF : HALF * (1 + .8*e);
        ctx.beginPath(); xPath(0, 0, h);
        ctx.globalAlpha = 1 - e; ctx.strokeStyle = colBase; ctx.lineWidth = 1; ctx.stroke();
        ctx.globalAlpha = e;     ctx.strokeStyle = colLit;  ctx.lineWidth = 1 + .4*e; ctx.stroke();
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
  }
  function step(ts){
    raf = 0;
    const dt = Math.min(50, last ? ts - last : 16.7); last = ts;
    const f = dt / 16.7;
    let busy = false;
    if(hoverCapable){
      const dx = tx - cx, dy = ty - cy;
      if(Math.abs(dx) < .5 && Math.abs(dy) < .5){ cx = tx; cy = ty; }
      else { const k = 1 - Math.pow(1 - .16, f); cx += dx*k; cy += dy*k; busy = true; }
      glow.style.setProperty('--mx', cx.toFixed(1) + 'px');
      glow.style.setProperty('--my', cy.toFixed(1) + 'px');
      const kk = 1 - Math.pow(1 - .13, f), R2 = R*R;
      for(let j=0; j<rows; j++){
        const y = OFF + j*CELL - cy;
        for(let i=0; i<cols; i++){
          const k = j*cols + i;
          let target = 0;
          if(lit){
            const x = OFF + i*CELL - cx, d2 = x*x + y*y;
            if(d2 < R2){ const u = 1 - Math.sqrt(d2)/R; target = u*u*(3-2*u); }
          }
          const cur = infl[k], d = target - cur;
          if(Math.abs(d) > .002){ infl[k] = cur + d*kk; busy = true; }
          else if(cur !== target) infl[k] = target;
        }
      }
    }
    drawFrame();
    if(busy) raf = requestAnimationFrame(step); else last = 0;
  }
  const kick = ()=>{ if(!raf) raf = requestAnimationFrame(step); };
  window.__bgRedraw = function(){ readColors(); drawFrame(); };
  window.addEventListener('resize', resize, { passive:true });
  resize();
  if(!hoverCapable) return;
  const dim = ()=>{ lit = false; document.body.classList.remove('cursor-lit'); kick(); };
  const onMove = (e)=>{
    tx = e.clientX; ty = e.clientY;
    if(!seen){ seen = true; cx = tx; cy = ty; }
    lit = true;
    document.body.classList.add('cursor-lit');
    clearTimeout(idleT); idleT = setTimeout(dim, 2200);
    kick();
  };
  const onLeave = ()=>{ clearTimeout(idleT); dim(); };
  window.addEventListener('pointermove', onMove, { passive:true });
  document.addEventListener('mouseleave', onLeave);
  window.addEventListener('blur', onLeave);
})();

/* ============================= MOTION HELPERS ============================= */
/* Type reveal: [data-rv="ch"] splits into letters, [data-rv="w"] into words. Only on a tab change. */
function revealText(root){
  (root||document).querySelectorAll('[data-rv="ch"],[data-rv="w"]').forEach(el=>{
    if(el.dataset.rvDone) return;
    el.dataset.rvDone = '1';
    const mode = el.dataset.rv;
    const label = el.textContent.replace(/\s+/g,' ').trim();
    if(label) el.setAttribute('aria-label', label);
    let i = 0;
    const walk = (node)=>{
      [...node.childNodes].forEach(n=>{
        if(n.nodeType===3){
          const text = n.textContent; if(!text) return;
          const frag = document.createDocumentFragment();
          const parts = mode==='ch' ? [...text] : text.split(/(\s+)/);
          parts.forEach(p=>{
            if(!p) return;
            if(mode==='w' && /^\s+$/.test(p)){ frag.appendChild(document.createTextNode(p)); return; }
            const s = document.createElement('span');
            s.setAttribute('aria-hidden','true');
            if(mode==='ch'){ s.className='rv-ch'; s.textContent=p; s.style.setProperty('--i', i++); frag.appendChild(s); }
            else { const m = document.createElement('span'); m.className='rv-wm'; m.setAttribute('aria-hidden','true'); s.className='rv-w'; s.textContent=p; s.style.setProperty('--i', i++); m.appendChild(s); frag.appendChild(m); }
          });
          n.replaceWith(frag);
        } else if(n.nodeType===1 && !n.classList.contains('rv-ch')) walk(n);
      });
    };
    walk(el);
  });
}

/* Tilt hover — perspective tilt that evades the cursor + a spotlight that follows it.
   Mounted on almost every box. Big boxes tilt less (angle and lift scale with size), boxes that hold
   other tilting boxes stay still (no nested wobble), and the interactive 3D city / tables / editors are skipped.
   Mouse/trackpad only; off for reduced motion. One rAF per frame, transform only. */
const TILT_SEL = '.kpi-card, .kpi-hero, .rule-card, .fd-card, .streak-box, .trade-card, .panel, .settings-group, .dim-table-card, .cal-cell:not(.empty), .rail-card';
const TILT_SKIP = '.fc, .table-scroll, .fd-composer, .nb-doc, .modal, .overlay';
const canTilt = ()=> window.matchMedia('(hover: hover) and (pointer: fine)').matches && !reducedMotion();
function mountTilt(root){
  if(!canTilt()) return;
  const scope = root || document;
  scope.querySelectorAll(TILT_SEL).forEach(el=>{
    if(el._tilt || el.matches(TILT_SKIP) || el.closest('.modal')) return;
    if(el.querySelector('.fd-edit')) return;
    if(el.querySelector(TILT_SEL)) return;                 /* container of tilting boxes: stay still */
    el._tilt = true; el.classList.add('tilt');
    const spot = document.createElement('span'); spot.className = 'tilt-spot'; spot.setAttribute('aria-hidden','true');
    el.appendChild(spot);
    let raf = 0, px = .5, py = .5, limit = 8, scale = 1.02;
    const apply = ()=>{
      raf = 0;
      const xRot = -(py - .5) * limit * 2, yRot = (px - .5) * limit * 2;
      el.style.transform = `perspective(1200px) rotateX(${xRot.toFixed(2)}deg) rotateY(${yRot.toFixed(2)}deg) scale3d(${scale},${scale},${scale})`;
      el.style.setProperty('--sx', (px*100).toFixed(1)+'%'); el.style.setProperty('--sy', (py*100).toFixed(1)+'%');
    };
    const measure = ()=>{
      const r = el.getBoundingClientRect(), m = Math.max(r.width, r.height) || 300;
      limit = Math.max(1.4, Math.min(9, 2300 / m));
      scale = 1 + Math.max(.004, Math.min(.03, 7 / m));
      return r;
    };
    el.addEventListener('pointerenter', (e)=>{ if(e.pointerType==='mouse'){ measure(); el.classList.add('tilt-on'); } });
    el.addEventListener('pointermove', (e)=>{
      if(e.pointerType!=='mouse') return;
      if(!el.classList.contains('tilt-on')){ measure(); el.classList.add('tilt-on'); }
      const r = el.getBoundingClientRect();
      px = (e.clientX - r.left) / r.width; py = (e.clientY - r.top) / r.height;
      if(!raf) raf = requestAnimationFrame(apply);
    });
    el.addEventListener('pointerleave', ()=>{
      cancelAnimationFrame(raf); raf = 0; el.classList.remove('tilt-on');
      el.style.transform = 'perspective(1200px) rotateX(0deg) rotateY(0deg) scale3d(1,1,1)';
    });
  });
}

/* Animated CSS variables that should glide from their previous value after a re-render
   (win-rate bars use --w, the win-rate ring uses --p). Keyed by data-tw. */
const lastTw = {};
function tweenVars(root, glide){
  const pending = [];
  (root||document).querySelectorAll('[data-tw]').forEach(el=>{
    const key = el.dataset.tw, prop = el.dataset.twProp || '--w';
    const val = el.style.getPropertyValue(prop).trim();
    const old = lastTw[key];
    lastTw[key] = val;
    if(glide && old != null && old !== val && !reducedMotion()){
      el.style.transition = 'none'; el.style.setProperty(prop, old); pending.push([el, prop, val]);
    }
  });
  if(pending.length){
    void document.body.offsetWidth;
    pending.forEach(([el, prop, val])=>{ el.style.transition = ''; el.style.setProperty(prop, val); });
  }
}

/* Same-page re-render (switching Real / Demo / Backtest, range, journal…): carry the visual state across
   so nothing snaps — segmented pills keep sliding from where they were, the hovered card keeps its tilt,
   bars/rings glide, numbers roll (count-up) and charts morph (see mountChart). */
function snapshotPage(main){
  const snap = { segs:{}, hover:null };
  main.querySelectorAll('.segmented[id]').forEach(seg=>{
    const p = seg.querySelector('.seg-pill'); if(!p) return;
    const r = p.getBoundingClientRect(), s = seg.getBoundingClientRect();
    snap.segs[seg.id] = { x: r.left - s.left - seg.clientLeft, w: r.width };
  });
  const tilts = [...main.querySelectorAll('.tilt')];
  const h = main.querySelector('.tilt.tilt-on');
  if(h) snap.hover = { i: tilts.indexOf(h), cls: h.classList[0], tf: h.style.transform, sx: h.style.getPropertyValue('--sx'), sy: h.style.getPropertyValue('--sy') };
  return snap;
}
function restorePage(root, snap){
  Object.keys(snap.segs).forEach(id=>{
    const seg = root.querySelector('#'+id); if(!seg || !seg._place) return;
    const pill = seg.querySelector('.seg-pill'); if(!pill) return;
    const o = snap.segs[id];
    pill.style.transition = 'none';
    pill.style.width = o.w+'px'; pill.style.transform = `translateX(${o.x}px)`;
    void pill.offsetWidth; pill.style.transition = '';
    seg._place(true);
  });
  if(snap.hover){
    const el = [...root.querySelectorAll('.tilt')][snap.hover.i];
    if(el && el.classList[0]===snap.hover.cls){
      el.style.transition = 'none';
      el.style.transform = snap.hover.tf;
      if(snap.hover.sx) el.style.setProperty('--sx', snap.hover.sx);
      if(snap.hover.sy) el.style.setProperty('--sy', snap.hover.sy);
      el.classList.add('tilt-on');
      void el.offsetWidth; el.style.transition = '';
    }
  }
}

/* ============================= SOUND ENGINE (Web Audio, synthesized) ============================= */
const SFX = (()=>{
  /* Apple-style UI sound design, all synthesized:
     - taps / ticks: very short, soft "glass" clicks (filtered noise + a high sine blip), like the iOS keyboard / picker wheel
     - chimes: bell tones (sine + slightly inharmonic partials, fast attack, long exponential tail) like Apple Pay / AirDrop
     - everything runs through a gentle compressor and a short airy room reverb, at low volume */
  let ctx = null, master = null, wet = null, dry = null;
  const enabled = ()=> state.settings.sound !== false;
  function ensure(){
    if(ctx){ if(ctx.state==='suspended') ctx.resume(); return ctx; }
    try{
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -20; comp.knee.value = 18; comp.ratio.value = 3; comp.attack.value = .003; comp.release.value = .18;
      master = ctx.createGain(); master.gain.value = .5;
      dry = ctx.createGain(); dry.gain.value = 1;
      wet = ctx.createGain(); wet.gain.value = .16;
      const verb = ctx.createConvolver();
      const len = Math.floor(ctx.sampleRate * .9), ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for(let ch=0; ch<2; ch++){ const d = ir.getChannelData(ch); for(let i=0; i<len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3.2); }
      verb.buffer = ir;
      dry.connect(comp); wet.connect(verb); verb.connect(comp);
      comp.connect(master); master.connect(ctx.destination);
    }catch(e){ ctx = null; }
    return ctx;
  }
  const out = (node, reverb)=>{ node.connect(dry); if(reverb) node.connect(wet); };
  /* a pure tone with optional pitch glide */
  function tone({f=880, f2=null, type='sine', dur=.12, vol=.2, attack=.003, delay=0, verb=true}){
    if(!enabled()) return; const c = ensure(); if(!c) return;
    const t0 = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur*.7);
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + attack); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g); out(g, verb); o.start(t0); o.stop(t0 + dur + .05);
  }
  /* bell: fundamental + soft inharmonic partials, each decaying at its own rate */
  function bell(f, {vol=.18, dur=.9, delay=0}={}){
    [[1, 1, 1], [2.01, .32, .55], [3.02, .12, .35], [4.17, .06, .22]].forEach(([mult, amp, dk])=>
      tone({ f: f*mult, dur: dur*dk + .05, vol: vol*amp, attack: .002, delay }));
  }
  /* soft click: band-passed noise grain */
  function click({freq=3200, q=1.2, dur=.018, vol=.12, delay=0}){
    if(!enabled()) return; const c = ensure(); if(!c) return;
    const t0 = c.currentTime + delay, len = Math.max(1, Math.floor(c.sampleRate*dur));
    const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for(let i=0; i<len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 4);
    const src = c.createBufferSource(); src.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
    const g = c.createGain(); g.gain.value = vol;
    src.connect(bp); bp.connect(g); out(g, false); src.start(t0);
  }
  /* breathy air sweep for sheets opening / closing */
  function air({from=600, to=2600, dur=.22, vol=.05, delay=0}){
    if(!enabled()) return; const c = ensure(); if(!c) return;
    const t0 = c.currentTime + delay, len = Math.floor(c.sampleRate*dur);
    const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for(let i=0; i<len; i++) d[i] = Math.random()*2-1;
    const src = c.createBufferSource(); src.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = .9;
    bp.frequency.setValueAtTime(from, t0); bp.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    const g = c.createGain(); g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + dur*.35); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    src.connect(bp); bp.connect(g); out(g, true); src.start(t0);
  }
  return {
    unlock(){ ensure(); },
    /* tactile */
    tap(){ click({freq:3400, dur:.014, vol:.10}); tone({f:2200, dur:.03, vol:.025, verb:false}); },
    tick(){ click({freq:4600, q:2, dur:.009, vol:.08}); },
    toggle(){ click({freq:2100, dur:.02, vol:.12}); tone({f:1480, dur:.05, vol:.035, verb:false, delay:.01}); },
    nav(){ click({freq:3000, dur:.012, vol:.07}); tone({f:1760, dur:.12, vol:.045}); },
    pop(){ tone({f:620, f2:1180, dur:.11, vol:.09}); click({freq:3800, dur:.01, vol:.05}); },
    swoosh(){ air({from:900, to:3200, dur:.18, vol:.035}); },
    /* sheets */
    open(){ air({from:500, to:2400, dur:.24, vol:.04}); tone({f:880, f2:1320, dur:.14, vol:.035, delay:.04}); },
    close(){ air({from:2400, to:600, dur:.2, vol:.03}); },
    /* outcomes */
    success(){ bell(1318.5, {vol:.11, dur:.8}); bell(1975.5, {vol:.09, dur:1, delay:.085}); },
    win(){ bell(1046.5, {vol:.09, dur:.6}); bell(1318.5, {vol:.09, dur:.6, delay:.07}); bell(1568, {vol:.1, dur:1.1, delay:.14}); },
    lossSave(){ bell(784, {vol:.08, dur:.5}); bell(659.3, {vol:.07, dur:.8, delay:.11}); },
    undo(){ bell(987.8, {vol:.07, dur:.4}); bell(1318.5, {vol:.08, dur:.6, delay:.08}); },
    del(){ tone({f:360, f2:150, dur:.16, vol:.12, verb:false}); air({from:1800, to:400, dur:.16, vol:.03}); },
    error(){ tone({f:330, dur:.07, vol:.09, type:'triangle', verb:false}); tone({f:330, dur:.09, vol:.09, type:'triangle', verb:false, delay:.1}); },
  };
})();
function haptic(kind){
  if(!navigator.vibrate) return;
  const map = { light:6, medium:12, heavy:22, success:[10,40,14], error:[30,50,30,50,30], select:4, warn:[14,60,14] };
  try{ navigator.vibrate(map[kind] || 6); }catch(e){}
}
// Global tap feedback: any interactive element gets a tiny click.
document.addEventListener('pointerdown', (e)=>{
  SFX.unlock();
  const el = e.target.closest('button, .nav-item, .mobile-nav-item, .cat-card, .cal-cell, tbody tr[data-id], .trade-card, .switch, .segmented button, .toggle-btn, label.btn-ghost, label.btn-secondary, .img-slot-thumb, .detail-img-thumb, select');
  if(!el) return;
  if(el.dataset.silent!=null) return;
  SFX.tap(); haptic('light');
}, {passive:true});

/* ============================= TOASTS ============================= */
function toast(msg, kind='ok', opts={}){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  const icon = kind==='ok' ? ICONS.check : kind==='err' ? ICONS.x : ICONS.info;
  el.innerHTML = `<span class="toast-ic ${kind}">${icon}</span><span>${msg}</span>${opts.action ? `<button class="toast-act" data-silent>${escapeHtml(opts.action)}</button>` : ''}`;
  wrap.appendChild(el);
  while(wrap.children.length>3) wrap.firstChild.remove();
  let done = false;
  const dismiss = ()=>{ if(done) return; done = true; el.classList.add('out'); setTimeout(()=>el.remove(), 320); };
  const timer = setTimeout(dismiss, opts.duration || (opts.action ? 5200 : 2600));
  if(opts.action){ el.querySelector('.toast-act').onclick = ()=>{ clearTimeout(timer); dismiss(); opts.onAction && opts.onAction(); }; }
  el.onclick = (e)=>{ if(e.target.closest('.toast-act')) return; clearTimeout(timer); dismiss(); };
  return dismiss;
}

/* ============================= OVERLAY STACK + DIALOGS ============================= */
const overlayStack = [];
function pushOverlay(overlay, closeFn){ overlayStack.push({overlay, closeFn}); document.body.classList.add('modal-open'); }
function popOverlay(overlay){
  const i = overlayStack.findIndex(o=>o.overlay===overlay); if(i>=0) overlayStack.splice(i,1);
  if(!overlayStack.length) document.body.classList.remove('modal-open');
}
function closeTopOverlay(){ const top = overlayStack[overlayStack.length-1]; if(top){ top.closeFn(); return true; } return false; }
/* A backdrop "click" only counts if the press ALSO started on the backdrop. Otherwise, pressing inside a
   dialog (e.g. selecting text, or holding a button) and releasing outside it makes the browser fire a click
   on the backdrop, which used to close the dialog and throw away everything typed into it. */
function onBackdropClick(overlay, handler){
  let pressedOnBackdrop = false;
  overlay.addEventListener('pointerdown', (e)=>{ pressedOnBackdrop = (e.target === overlay); }, true);
  overlay.addEventListener('click', (e)=>{
    const ok = pressedOnBackdrop && e.target === overlay;
    pressedOnBackdrop = false;
    if(ok) handler(e);
  });
}

function confirmDialog({title, message, okText='OK', cancelText='Cancel', danger=false}){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'overlay center';
    overlay.innerHTML = `<div class="alert-box" role="alertdialog">
      <div class="alert-body"><p class="alert-title">${title}</p>${message?`<p class="alert-msg">${message}</p>`:''}</div>
      <div class="alert-actions"><button data-v="0">${cancelText}</button><button data-v="1" class="bold ${danger?'danger':''}">${okText}</button></div>
    </div>`;
    document.body.appendChild(overlay);
    SFX.pop(); haptic(danger?'warn':'medium');
    const close = (v)=>{ overlay.classList.add('closing'); popOverlay(overlay); setTimeout(()=>overlay.remove(), 220); resolve(v); };
    pushOverlay(overlay, ()=>close(false));
    overlay.querySelectorAll('button').forEach(b=> b.onclick = ()=> close(b.dataset.v==='1'));
    onBackdropClick(overlay, ()=>close(false));
  });
}
function alertDialog(title, message){ return confirmDialog({title, message, okText:'OK', cancelText:'Close'}); }

function openImageLightbox(src, opts){
  if(!src) return;
  opts = opts || {};
  const overlay = document.createElement('div');
  overlay.className = 'img-lightbox';
  overlay.innerHTML = `<span class="lightbox-close" role="button" aria-label="Close">${ICONS.x}</span><img alt="" draggable="false">
    <div class="lightbox-bar" role="group" aria-label="Zoom">
      <button type="button" data-z="out" aria-label="Zoom out">−</button>
      <button type="button" data-z="reset" class="lb-level" aria-label="Fit to screen">100%</button>
      <button type="button" data-z="in" aria-label="Zoom in">+</button>
    </div>`;
  const img = overlay.querySelector('img'), level = overlay.querySelector('.lb-level');
  img.src = opts.full || src;              /* compressed copy shows instantly (or the just-added full copy) */
  document.body.appendChild(overlay);
  SFX.open(); haptic('light');

  /* ---- zoom / pan state: the picture is fitted to the screen at 100%; zoom is relative to that ---- */
  const MIN = 1, MAX = 8;
  let s = 1, tx = 0, ty = 0;
  const fitSize = ()=>{                    /* size of the picture itself (not its box) at zoom 100% */
    const bw = img.offsetWidth, bh = img.offsetHeight, nw = img.naturalWidth || bw, nh = img.naturalHeight || bh;
    const f = Math.min(bw/nw, bh/nh); return { w: nw*f, h: nh*f };
  };
  const clampPan = ()=>{
    const f = fitSize(), vw = overlay.clientWidth, vh = overlay.clientHeight;
    const mx = Math.max(0, (f.w*s - vw)/2), my = Math.max(0, (f.h*s - vh)/2);
    tx = Math.min(mx, Math.max(-mx, tx)); ty = Math.min(my, Math.max(-my, ty));
  };
  const apply = (animate)=>{
    clampPan();
    img.style.animation = 'none';
    img.style.transition = animate ? 'transform .22s cubic-bezier(.22,1,.36,1)' : 'none';
    img.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
    img.style.cursor = s > 1 ? 'grab' : 'zoom-in';
    level.textContent = Math.round(s*100) + '%';
  };
  const zoomAt = (px, py, factor, animate)=>{      /* zoom keeping the point under (px,py) fixed */
    const ns = Math.min(MAX, Math.max(MIN, s*factor)), r = ns/s;
    const cx = overlay.clientWidth/2, cy = overlay.clientHeight/2;
    tx = (px-cx) - r*((px-cx) - tx); ty = (py-cy) - r*((py-cy) - ty);
    s = ns; if(s === 1){ tx = 0; ty = 0; }
    apply(animate);
  };
  const resetZoom = ()=>{ s = 1; tx = 0; ty = 0; apply(true); };
  const centre = ()=>[overlay.clientWidth/2, overlay.clientHeight/2];

  let closed = false;
  const onKey = (e)=>{
    const top = overlayStack[overlayStack.length-1]; if(!top || top.overlay !== overlay) return;
    if(e.key === '+' || e.key === '='){ e.preventDefault(); zoomAt(...centre(), 1.5, true); }
    else if(e.key === '-' || e.key === '_'){ e.preventDefault(); zoomAt(...centre(), 1/1.5, true); }
    else if(e.key === '0'){ e.preventDefault(); resetZoom(); }
  };
  const onResize = ()=> apply(false);
  const close = ()=>{
    if(closed) return; closed = true;
    document.removeEventListener('keydown', onKey); window.removeEventListener('resize', onResize);
    overlay.classList.add('closing'); popOverlay(overlay);
    /* drop the image data as soon as the viewer is gone so the full-res copy is not kept in memory */
    setTimeout(()=>{ img.removeAttribute('src'); overlay.remove(); }, 200);
    SFX.close();
  };
  pushOverlay(overlay, close);
  document.addEventListener('keydown', onKey);
  window.addEventListener('resize', onResize);
  overlay.querySelector('.lightbox-close').onclick = close;
  overlay.querySelectorAll('.lightbox-bar button').forEach(b=> b.onclick = ()=>{
    const z = b.dataset.z;
    if(z === 'in') zoomAt(...centre(), 1.5, true); else if(z === 'out') zoomAt(...centre(), 1/1.5, true); else resetZoom();
  });

  /* ---- gestures: wheel, drag to pan, pinch, double-tap / double-click ---- */
  const insidePicture = (x, y)=>{
    const r = img.getBoundingClientRect(), ar = (img.naturalWidth || 1) / (img.naturalHeight || 1);
    let w = r.width, h = r.height; if(w/h > ar) w = h*ar; else h = w/ar;
    return Math.abs(x - (r.left + r.width/2)) <= w/2 && Math.abs(y - (r.top + r.height/2)) <= h/2;
  };
  overlay.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const dy = e.deltaMode === 1 ? e.deltaY*33 : e.deltaY;
    zoomAt(e.clientX, e.clientY, Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0018)), false);
  }, { passive:false });

  const ptrs = new Map();
  let pinch = null, moved = false, gesture = false, downOutside = false, lastTap = { t:0, x:0, y:0 };
  overlay.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('.lightbox-bar, .lightbox-close')) return;
    try{ overlay.setPointerCapture(e.pointerId); }catch(_){}
    ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY });
    if(ptrs.size === 1){ moved = false; gesture = false; downOutside = !insidePicture(e.clientX, e.clientY); }
    else { gesture = true; const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x-b.x, a.y-b.y) || 1, s }; }
    if(s > 1) img.style.cursor = 'grabbing';
  });
  overlay.addEventListener('pointermove', (e)=>{
    const p = ptrs.get(e.pointerId); if(!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if(ptrs.size >= 2 && pinch){
      const [a, b] = [...ptrs.values()], d = Math.hypot(a.x-b.x, a.y-b.y) || 1;
      zoomAt((a.x+b.x)/2, (a.y+b.y)/2, (pinch.s * d / pinch.d) / s, false);
      moved = true; return;
    }
    if(Math.hypot(e.clientX-p.sx, e.clientY-p.sy) > 6) moved = true;
    if(moved && s > 1){ tx += dx; ty += dy; apply(false); }
  });
  const endPointer = (e)=>{
    if(!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if(ptrs.size < 2) pinch = null;
    if(ptrs.size) return;
    img.style.cursor = s > 1 ? 'grab' : 'zoom-in';
    if(e.type !== 'pointerup' || moved || gesture) return;
    if(downOutside && !insidePicture(e.clientX, e.clientY)){ close(); return; }   /* tap on the dark area closes */
    const now = performance.now();
    if(now - lastTap.t < 320 && Math.hypot(e.clientX-lastTap.x, e.clientY-lastTap.y) < 30){
      lastTap.t = 0;
      if(s > 1.05) resetZoom(); else zoomAt(e.clientX, e.clientY, 3, true);
    } else lastTap = { t:now, x:e.clientX, y:e.clientY };
  };
  overlay.addEventListener('pointerup', endPointer);
  overlay.addEventListener('pointercancel', endPointer);

  if(!opts.full && opts.tradeId && opts.key){
    const status = document.createElement('span');
    status.className = 'lightbox-status'; status.textContent = 'Loading full resolution…';
    overlay.appendChild(status);
    loadFullImage(opts.tradeId, opts.key).then(full=>{
      if(closed) return;
      if(full){ img.onload = ()=>{ status.remove(); }; img.src = full; }   /* zoom state is kept across the swap */
      else { status.textContent = 'Full resolution unavailable'; setTimeout(()=>status.remove(), 1800); }
    });
  }
}

// Sliding pill for .segmented controls
function mountSegmented(root){
  (root||document).querySelectorAll('.segmented').forEach(seg=>{
    let pill = seg.querySelector('.seg-pill');
    if(!pill){ pill = document.createElement('span'); pill.className='seg-pill'; seg.prepend(pill); }
    const place = (animate)=>{
      const a = seg.querySelector('button.active'); if(!a){ pill.style.opacity='0'; return; }
      pill.style.opacity='1';
      if(!animate) pill.style.transition='none';
      pill.style.width = a.offsetWidth+'px';
      pill.style.transform = `translateX(${a.offsetLeft}px)`;
      if(!animate){ void pill.offsetWidth; pill.style.transition=''; }
    };
    place(false);
    seg._place = place;
  });
}
// Same idea for .toggle-row inside the trade form
function mountToggleRows(root){
  (root||document).querySelectorAll('.toggle-row').forEach(seg=>{
    let pill = seg.querySelector('.seg-pill');
    if(!pill){ pill = document.createElement('span'); pill.className='seg-pill'; seg.prepend(pill); }
    const place = (animate)=>{
      const a = seg.querySelector('.toggle-btn.active'); if(!a){ pill.style.opacity='0'; return; }
      pill.style.opacity='1';
      if(!animate) pill.style.transition='none';
      pill.style.width = a.offsetWidth+'px';
      pill.style.transform = `translateX(${a.offsetLeft}px)`;
      if(!animate){ void pill.offsetWidth; pill.style.transition=''; }

}
// Switch active segment with slide, then run callback after the pill has moved.
function segSelect(seg, btn, cb){
  /* Run the update right away. If it re-renders the page, the new control picks the pill up from
     where it was (snapshotPage/restorePage) and slides on — no wait, no jump. */
  seg.querySelectorAll('button').forEach(x=>x.classList.toggle('active', x===btn));
  SFX.tick(); haptic('select');
  cb();
  if(seg.isConnected && seg._place) seg._place(true);
}
window.addEventListener('resize', ()=>{ document.querySelectorAll('.segmented,.toggle-row').forEach(s=> s._place && s._place(false)); placeNavIndicator(false); });

// Count-up for KPI values
const lastNums = {};
function countUp(el){
  const target = parseFloat(el.dataset.count); if(isNaN(target)) return;
  const key = el.dataset.key || el.dataset.count;
  const from = lastNums[key] != null ? lastNums[key] : 0;
  lastNums[key] = target;
  const fmt = el.dataset.fmt || 'int';
  const render = (v)=>{ el.textContent = fmt==='pct' ? fmtPct(v) : fmt==='r' ? fmtRavg(v) : Math.round(v); };
  if(reducedMotion() || from===target){ render(target); return; }
  const dur = 1000, t0 = performance.now();
  const step = (now)=>{
    const p = Math.min(1, (now-t0)/dur); const e = 1 - Math.pow(1-p, 4);
    render(from + (target-from)*e);
    if(p<1) requestAnimationFrame(step); else render(target);
  };
  requestAnimationFrame(step);
}
function mountCountUps(root){ (root||document).querySelectorAll('[data-count]').forEach(countUp); }

// Called after each page render
function afterRender(root){
  mountSegmented(root);
  mountCountUps(root);
  (root||document).querySelectorAll('tbody tr[data-id]').forEach((tr,i)=>{ if(i<30){ tr.classList.add('row-in'); tr.style.animationDelay = (i*22)+'ms'; } });
  (root||document).querySelectorAll('.cal-cell:not(.empty)').forEach((c,i)=>{ c.style.animationDelay = (i*5)+'ms'; });
  if(root && root.classList && root.classList.contains('tab-anim') && !reducedMotion()) revealText(root);
  mountTilt(root);
}

// Bottom-sheet drag-to-dismiss (mobile only)
function enableSheetDrag(modal, onClose, isDirty){
  const grab = modal.querySelector('.modal-grabber'); if(!grab) return;
  let startY=0, curY=0, dragging=false, startT=0;
  const onStart = (e)=>{
    if(!isMobile()) return;
    dragging = true; startY = e.touches ? e.touches[0].clientY : e.clientY; curY = startY; startT = performance.now();
    modal.classList.add('dragging'); modal.classList.remove('snapback');
  };
  const onMove = (e)=>{
    if(!dragging) return;
    curY = e.touches ? e.touches[0].clientY : e.clientY;
    const dy = Math.max(0, curY-startY);
    modal.style.transform = `translateY(${dy}px)`;
    if(e.cancelable) e.preventDefault();
  };
  const onEnd = ()=>{
    if(!dragging) return; dragging=false;
    const dy = Math.max(0, curY-startY); const v = dy / Math.max(1, performance.now()-startT);
    modal.classList.remove('dragging');
    if((dy>120 || v>0.6) && !(isDirty && isDirty())){ modal.style.setProperty('--drag', dy+'px'); haptic('light'); onClose(); }
    else { modal.classList.add('snapback'); modal.style.transform='translateY(0)'; setTimeout(()=>{ modal.classList.remove('snapback'); modal.style.transform=''; }, 450); if((dy>120 || v>0.6) && isDirty && isDirty()) onClose(); }
  };
  grab.addEventListener('touchstart', onStart, {passive:true});
  grab.addEventListener('touchmove', onMove, {passive:false});
  grab.addEventListener('touchend', onEnd);
  grab.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
}
function makeOverlay(innerHtml, extraClass, opts){
  opts = opts || {};
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<div class="modal ${extraClass||''}"><div class="modal-grabber"></div>${innerHtml}</div>`;
  document.body.appendChild(overlay);
  const modal = overlay.querySelector('.modal');
  const mh = modal.querySelector('.modal-head h2');
  if(mh && !reducedMotion()){ mh.dataset.rv = 'ch'; revealText(modal.querySelector('.modal-head')); }
  let closed = false;
  /* close(): always closes. requestClose(): the "safe" path used by Esc, backdrop, swipe-down, X and Cancel —
     if the dialog reports unsaved changes it asks before discarding them. */
  const close = ()=>{
    if(closed) return; closed = true;
    overlay.classList.add('closing'); popOverlay(overlay); SFX.close();
    setTimeout(()=> overlay.remove(), 260);
  };
  let asking = false;
  const requestClose = async ()=>{
    if(closed || asking) return;
    if(opts.isDirty && opts.isDirty()){
      asking = true;
      const discard = await confirmDialog({ title:'Discard your changes?', message:'Everything you entered in this form will be lost.', okText:'Discard', cancelText:'Keep editing', danger:true });
      asking = false;
      if(!discard) return;
    }
    close();
  };
  pushOverlay(overlay, requestClose);
  onBackdropClick(overlay, requestClose);
  enableSheetDrag(modal, requestClose, opts.isDirty);
  SFX.open(); haptic('light');
  return { overlay, modal, close, requestClose };
}
function hideSplash(){ const s = document.getElementById('splash'); if(s) s.classList.add('hidden'); }

// Keyboard shortcuts
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){ if(closeTopOverlay()) e.preventDefault(); return; }
  /* Never fire page shortcuts while typing, while a pop-up menu is open, or while anything form-like has focus */
  if(Pop.isOpen() || e.defaultPrevented || e.repeat) return;
  const typing = (n)=> n && n.nodeType===1 && (n.isContentEditable || (n.closest && n.closest('input,textarea,select,[contenteditable],.pop')));
  if(typing(e.target) || typing(document.activeElement)) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(!state.loaded || overlayStack.length) return;
  if(e.key==='n' || e.key==='N'){ e.preventDefault(); openTradeModal(); }
  else if(e.key>='1' && e.key<='8'){ e.preventDefault(); goTab(TABS[parseInt(e.key)-1]); }
  else if(e.key==='t' || e.key==='T'){ e.preventDefault(); toggleTheme(); }
  else if(e.key==='/' ){ const s = document.getElementById('fSearch'); if(s){ e.preventDefault(); s.focus(); } }
});

/* ============================= CUSTOM POP-UP MENUS ============================= */
/* The browser's own dropdowns and date pickers are replaced everywhere:
   - every <select> gets a styled button + menu (the hidden native select keeps the value and fires
     the usual 'change' event, so all existing code keeps working);
   - every <input type="date"> gets a button + calendar pop-up;
   - the Calendar tab uses a month + year picker (no day).
   While a pop-up is open it owns the keyboard, so digits never reach the page shortcuts. */
const POP_CHEV = '<svg class="cs-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const POP_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const POP_CAL = '<svg class="cs-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="4"/><path d="M3 10h18M8 2.5v4M16 2.5v4"/></svg>';
const POP_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>';
const POP_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';

const Pop = (()=>{
  let cur = null;
  function place(){
    if(!cur) return;
    if(!cur.anchor.isConnected){ close(); return; }
    const a = cur.anchor.getBoundingClientRect(), el = cur.el;
    const vw = window.innerWidth, vh = window.innerHeight, m = 8;
    el.style.maxWidth = (vw - m*2) + 'px';
    const w = el.offsetWidth, h = el.offsetHeight;
    let left = cur.align==='right' ? a.right - w : a.left;
    left = Math.max(m, Math.min(vw - w - m, left));
    const below = vh - a.bottom - m, above = a.top - m;
    let top, up = false;
    if(h + 6 <= below || below >= above) top = a.bottom + 6;
    else { top = a.top - 6 - h; up = true; }
    if(!up && top + h > vh - m) el.style.maxHeight = Math.max(160, vh - top - m) + 'px';
    if(up && top < m){ top = m; el.style.maxHeight = (a.top - 6 - m) + 'px'; }
    el.classList.toggle('up', up);
    el.style.left = Math.round(left) + 'px'; el.style.top = Math.round(top) + 'px';
  }
  function onDown(e){ if(!cur) return; if(cur.el.contains(e.target) || cur.anchor.contains(e.target)) return; close(); }
  function onKey(e){
    if(!cur) return;
    if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); const a = cur.anchor; close(); try{ a.focus({preventScroll:true}); }catch(_){} return; }
    if(e.key==='Tab'){ close(); return; }
    e.stopPropagation();                                   /* nothing leaks to the page shortcuts */
    if(cur.onKey) cur.onKey(e);
  }
  function onScroll(e){ if(cur && !cur.el.contains(e.target)) place(); }
  function close(){
    if(!cur) return;
    const c = cur; cur = null;
    c.el.classList.add('pop-out'); setTimeout(()=> c.el.remove(), 140);
    c.anchor.classList.remove('cs-open'); c.anchor.setAttribute('aria-expanded','false');
    document.removeEventListener('pointerdown', onDown, true);
    document.removeEventListener('keydown', onKey, true);
    window.removeEventListener('resize', close);
    window.removeEventListener('scroll', onScroll, true);
    if(c.onClose) c.onClose();
  }
  function open(anchor, el, opts){
    const same = cur && cur.anchor===anchor;
    close();
    if(same) return false;                                 /* second click on the trigger closes it */
    opts = opts || {};
    el.classList.add('pop');
    el.addEventListener('mousedown', e=> e.preventDefault()); /* keep focus / text selection where it was */
    document.body.appendChild(el);
    cur = { anchor, el, onKey: opts.onKey, onClose: opts.onClose, align: opts.align };
    anchor.classList.add('cs-open'); anchor.setAttribute('aria-expanded','true');
    place();
    document.addEventListener('pointerdown', onDown, true);
    document.addEventListener('keydown', onKey, true);
    window.addEventListener('resize', close);
    window.addEventListener('scroll', onScroll, true);
    return true;
  }
  return { open, close, place, isOpen: ()=> !!cur };
})();

/* ---------- <select> → custom menu ---------- */
function csWatchValue(el, proto, props, sync){
  props.forEach(p=>{
    const d = Object.getOwnPropertyDescriptor(proto, p); if(!d || !d.set) return;
    Object.defineProperty(el, p, { configurable:true, get(){ return d.get.call(this); }, set(v){ d.set.call(this, v); sync(); } });
  });
}
function enhanceSelect(sel){
  if(sel._cs || sel.multiple || sel.closest('.pop')) return;
  sel._cs = true;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.setAttribute('aria-haspopup','listbox'); btn.setAttribute('aria-expanded','false');
  if(sel.getAttribute('aria-label') || sel.title) btn.setAttribute('aria-label', sel.getAttribute('aria-label') || sel.title);
  if(sel.title) btn.title = sel.title;
  const sync = ()=>{
    const o = sel.options[sel.selectedIndex];
    btn.className = 'cs-btn ' + [...sel.classList].filter(c=>c!=='cs-native').join(' ');
    btn.style.cssText = sel.style.cssText;
    btn.disabled = sel.disabled;
    btn.innerHTML = `<span class="cs-lbl">${escapeHtml(o ? o.text : '')}</span>${POP_CHEV}`;
  };
  sel._csSync = sync;
  sel.classList.add('cs-native'); sel.tabIndex = -1;
  sel.after(btn);
  sel._csBtn = btn;
  sync();
  csWatchValue(sel, HTMLSelectElement.prototype, ['value','selectedIndex'], sync);
  sel.addEventListener('change', sync);
  new MutationObserver(sync).observe(sel, { childList:true, subtree:true, attributes:true, attributeFilter:['class','disabled','style'] });
  sel.addEventListener('focus', ()=> btn.focus());
  if(sel.closest('.nb-toolbar')) btn.addEventListener('mousedown', e=> e.preventDefault());
  btn.addEventListener('click', ()=> openSelectMenu(sel, btn));
  btn.addEventListener('keydown', (e)=>{ if(e.key==='ArrowDown' || e.key==='ArrowUp'){ e.preventDefault(); openSelectMenu(sel, btn); } });
}
function openSelectMenu(sel, btn){
  const opts = [...sel.options];
  const compact = opts.length > 12 && opts.every(o=> o.text.length <= 3);
  const el = document.createElement('div');
  el.className = 'pop-list' + (compact ? ' pop-grid' : '');
  el.setAttribute('role','listbox');
  el.innerHTML = opts.map((o,i)=>`<button type="button" role="option" class="pop-item ${i===sel.selectedIndex?'sel':''}" data-i="${i}" ${o.disabled?'disabled':''} style="--i:${Math.min(i,14)}"><span class="pop-check">${POP_CHECK}</span><span>${escapeHtml(o.text)}</span></button>`).join('');
  el.style.minWidth = Math.max(btn.offsetWidth, compact ? 250 : 170) + 'px';
  let hi = Math.max(0, sel.selectedIndex);
  const items = ()=> [...el.querySelectorAll('.pop-item')];
  const mark = ()=>{ items().forEach((b,i)=> b.classList.toggle('hi', i===hi)); const h = items()[hi]; if(h) h.scrollIntoView({block:'nearest'}); };
  const choose = (i)=>{
    const changed = sel.selectedIndex !== i;
    sel.selectedIndex = i;
    Pop.close();
    if(changed){ sel.dispatchEvent(new Event('input', {bubbles:true})); sel.dispatchEvent(new Event('change', {bubbles:true})); }
    SFX.tick(); haptic('select');
    if(!sel.closest('.nb-toolbar')) try{ btn.focus({preventScroll:true}); }catch(_){}
  };
  el.addEventListener('click', (e)=>{ const b = e.target.closest('.pop-item'); if(b && !b.disabled) choose(+b.dataset.i); });
  const cols = compact ? 6 : 1;
  let typed = '', typedT = 0;
  if(!Pop.open(btn, el, { onKey:(e)=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); hi = Math.min(opts.length-1, hi + cols); mark(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); hi = Math.max(0, hi - cols); mark(); }
    else if(compact && e.key==='ArrowRight'){ e.preventDefault(); hi = Math.min(opts.length-1, hi + 1); mark(); }
    else if(compact && e.key==='ArrowLeft'){ e.preventDefault(); hi = Math.max(0, hi - 1); mark(); }
    else if(e.key==='Enter' || e.key===' '){ e.preventDefault(); if(!opts[hi].disabled) choose(hi); }
    else if(e.key.length===1 && !e.metaKey && !e.ctrlKey){
      const now = Date.now(); typed = (now - typedT < 700 ? typed : '') + e.key.toLowerCase(); typedT = now;
      const j = opts.findIndex(o=> o.text.toLowerCase().startsWith(typed)); if(j>=0){ hi = j; mark(); }
    }
  }})) return;
  SFX.tick();
  const s = el.querySelector('.pop-item.sel'); if(s) s.scrollIntoView({block:'center'});
}

/* ---------- <input type="date"> → calendar pop-up ---------- */
const pad2 = n=> String(n).padStart(2,'0');
const isoOf = (y,m,d)=> `${y}-${pad2(m+1)}-${pad2(d)}`;
function enhanceDate(input){
  if(input._cs) return;

  btn.type = 'button'; btn.setAttribute('aria-haspopup','dialog'); btn.setAttribute('aria-expanded','false');
  btn.setAttribute('aria-label', input.getAttribute('aria-label') || 'Choose a date');
  const sync = ()=>{
    const v = input.value;
    btn.className = 'cs-btn cs-date ' + [...input.classList].filter(c=>c!=='cs-native').join(' ');
    btn.innerHTML = `${POP_CAL}<span class="cs-lbl ${v?'':'ph'}">${v ? prettyDate(v) : 'Choose a date'}</span>${POP_CHEV}`;
  };
  input.classList.add('cs-native'); input.tabIndex = -1;

  input._csBtn = btn;

  input.addEventListener('change', sync);

function openDatePicker(input, btn){
  const today = localISO();
  const sel = input.value || '';
  const base = new Date((sel || today) + 'T00:00:00');
  let vy = base.getFullYear(), vm = base.getMonth(), mode = 'days', dir = '';
  const min = input.min || '', max = input.max || '';
  const marks = input._csMarks ? input._csMarks() : null;      /* optional: days that have entries */
  const el = document.createElement('div');
  el.className = 'pop-cal'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Choose a date');
  const draw = ()=>{
    if(mode==='days'){
      const first = new Date(vy, vm, 1), lead = (first.getDay() + 6) % 7, dim = new Date(vy, vm+1, 0).getDate();
      let cells = '';
      for(let i=0; i<42; i++){
        const d = new Date(vy, vm, 1 - lead + i), iso = isoOf(d.getFullYear(), d.getMonth(), d.getDate());
        const out = d.getMonth() !== vm, dis = (min && iso < min) || (max && iso > max);
        cells += `<button type="button" class="pc-day ${out?'out':''} ${iso===today?'today':''} ${iso===sel?'sel':''} ${marks && marks[iso]?'has':''}" data-d="${iso}" ${dis?'disabled':''}>${d.getDate()}</button>`;
      }
      el.innerHTML = `<div class="pc-head"><button type="button" class="pc-nav" data-step="-1" aria-label="Previous month">${POP_L}</button><button type="button" class="pc-title" data-mode="months">${MONTH_NAMES[vm]} ${vy}${POP_CHEV}</button><button type="button" class="pc-nav" data-step="1" aria-label="Next month">${POP_R}</button></div>
        <div class="pc-body ${dir}"><div class="pc-dow">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(n=>`<span>${n}</span>`).join('')}</div><div class="pc-days">${cells}</div></div>

/* ---- Session clock (every page): New York time, CME session map, countdown ---- */
const SESSIONS = [
  { k:'asia',   n:'Asia',      a:20*60,    b:24*60 },
  { k:'london', n:'London',    a:2*60,     b:5*60 },
  { k:'nyam',   n:'NY AM',     a:9*60+30,  b:12*60 },
  { k:'lunch',  n:'NY lunch',  a:12*60,    b:13*60+30 },
  { k:'nypm',   n:'NY PM',     a:13*60+30, b:16*60 },
];
function etParts(d){
  const f = new Intl.DateTimeFormat('en-US', { timeZone:'America/New_York', hour12:false, weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
  const o = {}; f.formatToParts(d || new Date()).forEach(p=> o[p.type] = p.value);
  const h = parseInt(o.hour,10) % 24, m = parseInt(o.minute,10), s = parseInt(o.second,10);
  return { dow: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(o.weekday), wd:o.weekday, mon:o.month, day:o.day, h, m, s, mins: h*60 + m + s/60 };
}
/* CME equity futures: Sun 18:00 → Fri 17:00 ET, with a daily 17:00–18:00 halt */
function cmeOpen(dow, mins){
  if(dow===6) return false;
  if(dow===0) return mins >= 18*60;
  if(dow===5) return mins < 17*60;
  return !(mins >= 17*60 && mins < 18*60);
}
const fmtDur = (min)=>{ min = Math.max(0, Math.round(min)); const h = Math.floor(min/60), m = min%60; return h ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}m`; };
function clockState(){
  const t = etParts(), open = cmeOpen(t.dow, t.mins);
  const cur = open ? SESSIONS.find(s=> t.mins >= s.a && t.mins < s.b) : null;
  let next = null;
  for(let off=0; off<4 && !next; off++){
    const dow = (t.dow + off) % 7;
    const cands = SESSIONS.map(s=>({ s, at: off*1440 + s.a })).concat(dow===0 ? [{ s:{ n:'Globex', k:'globex' }, at: off*1440 + 18*60 }] : []);
    cands.sort((a,b)=> a.at - b.at).forEach(c=>{ if(!next && c.at > t.mins + .01 && cmeOpen(dow, (c.at - off*1440) + .5)) next = c; });
  }
  let status, sub;
  if(!open && (t.dow===6 || (t.dow===0 && t.mins < 18*60) || (t.dow===5 && t.mins >= 17*60))){ status = 'Market closed'; sub = 'Weekend · Globex reopens Sunday 18:00 ET'; }
  else if(!open){ status = 'Daily halt'; sub = 'CME maintenance break · back at 18:00 ET'; }
  else if(cur){ status = cur.n + ' session'; sub = `${cur.n} ends in ${fmtDur(cur.b - t.mins)}`; }
  else { status = 'Between sessions'; sub = 'Globex is trading'; }
  return { t, open, cur, next, status, sub };
}
function clockCardHtml(){
  const segs = SESSIONS.map(s=>`<i class="cl-seg cl-${s.k}" data-k="${s.k}" style="left:${(s.a/1440*100).toFixed(2)}%;width:${((s.b-s.a)/1440*100).toFixed(2)}%" title="${s.n} · ${String(Math.floor(s.a/60)).padStart(2,'0')}:${String(s.a%60).padStart(2,'0')}–${String(Math.floor(s.b/60)%24).padStart(2,'0')}:${String(s.b%60).padStart(2,'0')} ET"></i>`).join('');
  return `<div class="rail-card rail-clock" id="railClock">
    <div class="rc-k">New York · CME futures</div>
    <div class="clk-time"><span id="clkTime">--:--</span><small id="clkSec">--</small><em>ET</em></div>
    <div class="clk-date" id="clkDate"></div>
    <div class="clk-status"><span class="clk-dot" id="clkDot"></span><b id="clkStatus"></b></div>
    <div class="clk-sub" id="clkSub"></div>
    <div class="clk-track"><i class="cl-halt" style="left:${(17/24*100).toFixed(2)}%;width:${(1/24*100).toFixed(2)}%"></i>${segs}<span class="clk-now" id="clkNow"></span></div>
    <div class="clk-scale"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
    <div class="clk-legend">${SESSIONS.map(s=>`<span><i class="cl-${s.k}"></i>${s.n}</span>`).join('')}</div>
    <div class="clk-next" id="clkNext"></div>
  </div>`;
}
function tickClock(){
  const el = document.getElementById('railClock'); if(!el || !el.offsetParent) return;
  const c = clockState(), t = c.t, p2 = n=> String(n).padStart(2,'0');
  document.getElementById('clkTime').textContent = `${p2(t.h)}:${p2(t.m)}`;

  else nx.innerHTML = '';
}

function computeStats(trades){

  const be = trades.length - n;
  const winRate = n ? wins.length/n*100 : 0;

  let curStreak=0, curType=null, bestWinStreak=0, worstLossStreak=0, tmpW=0, tmpL=0;

    else { tmpL++; tmpW=0; worstLossStreak=Math.max(worstLossStreak,tmpL); }

  const xi = Math.sqrt(Math.max(0, (ir + rr)*(ir + rr) - dd*dd));
  const loc = (x, y, a)=>[cx + x*Math.cos(a) - y*Math.sin(a), cy + x*Math.sin(a) + y*Math.cos(a)];
  const Co0 = loc(xo, dd, a0), Ci0 = loc(xi, dd, a0), Co1 = loc(xo, -dd, a1), Ci1 = loc(xi, -dd, a1);
  const ao0 = a0 + Math.atan2(dd, xo), ai0 = a0 + Math.atan2(dd, xi);
  const ao1 = a1 - Math.atan2(dd, xo), ai1 = a1 - Math.atan2(dd, xi);
  ctx.beginPath();
  ctx.arc(cx, cy, R, ao0, ao1, false);
  ctx.arc(Co1[0], Co1[1], rr, ao1, a1 + Math.PI/2, false);
  ctx.arc(Ci1[0], Ci1[1], rr, a1 + Math.PI/2, ai1 + Math.PI, false);
  ctx.arc(cx, cy, ir, ai1, ai0, true);
  ctx.arc(Ci0[0], Ci0[1], rr, ai0 + Math.PI, a0 + 1.5*Math.PI, false);
  ctx.arc(Co0[0], Co0[1], rr, a0 - Math.PI/2, ao0, false);
  ctx.closePath(); ctx.fill();
}
const donutRingPlugin = {
  id: 'donutRing',
  beforeDatasetDraw(chart, args){
    if(chart.config.type !== 'doughnut') return;
    const ds = chart.data.datasets[args.index], ctx = chart.ctx;
    const items = [];
    args.meta.data.forEach((arc, i)=>{
      const p = arc.getProps(['startAngle','endAngle','innerRadius','outerRadius','x','y']);
      if(p.endAngle - p.startAngle > 1e-4) items.push({ arc, p, i });
    });
    items.forEach(({arc, p, i})=>{
      const mid = (p.startAngle + p.endAngle)/2, off = arc.options.offset || 0;
      const pair = (ds.gradPairs && ds.gradPairs[i]) || null;
      ctx.save();
      ctx.translate(Math.cos(mid)*off, Math.sin(mid)*off);
      if(pair){
        const rm = (p.outerRadius + p.innerRadius)/2;
        const g = ctx.createLinearGradient(p.x + Math.cos(p.startAngle)*rm, p.y + Math.sin(p.startAngle)*rm, p.x + Math.cos(p.endAngle)*rm, p.y + Math.sin(p.endAngle)*rm);
        g.addColorStop(0, pair[0]); g.addColorStop(1, pair[1]);
        ctx.fillStyle = g;
      } else ctx.fillStyle = Array.isArray(ds.backgroundColor) ? ds.backgroundColor[i] : ds.backgroundColor;
      if(items.length === 1){
        ctx.beginPath(); ctx.arc(p.x, p.y, p.outerRadius, 0, Math.PI*2); ctx.moveTo(p.x + p.innerRadius, p.y);
        ctx.arc(p.x, p.y, p.innerRadius, 0, Math.PI*2, true); ctx.fill('evenodd');
      } else drawRingSlice(ctx, p.x, p.y, p.outerRadius, p.innerRadius, p.startAngle, p.endAngle);
      ctx.restore();
    });
    return false;
  }
};

/* animate = tab change (full entrance). Otherwise it's an update of the same page: visual state is
   carried across (see snapshotPage) and opts.swap gives changed text a soft refresh. */
let renderAnimated = false;
function renderMain(animate, opts){
  const main = document.getElementById('main'); if(!main) return;
  const same = !animate && main._tab===state.activeTab && main.firstElementChild;
  const snap = same ? snapshotPage(main) : null;
  renderAnimated = !!animate;
  invalidatePal();
  Object.keys(charts).forEach(destroyChart);
  cityTeardown();
  main.classList.toggle('main-wide', state.activeTab==='log');
  const wrap = document.createElement('div');
  wrap.className = animate ? 'page tab-anim' : (opts && opts.swap ? 'page swap' : 'page');
  main.innerHTML = ''; main.appendChild(wrap);
  main._tab = state.activeTab;
  if(state.activeTab==='dashboard') renderDashboard(wrap);
  else if(state.activeTab==='log') renderLog(wrap);
  else if(state.activeTab==='analytics') renderAnalytics(wrap);
  else if(state.activeTab==='calendar') renderCalendar(wrap);
  else if(state.activeTab==='rulebook') renderRulebook(wrap);
  else if(state.activeTab==='fade') renderFade(wrap);
  else if(state.activeTab==='notebook') renderNotebook(wrap);
  else if(state.activeTab==='settings') renderSettings(wrap);
  afterRender(wrap);
  tweenVars(wrap, !animate);
  if(snap) restorePage(wrap, snap);
  if(FILL_SPACE) renderRail(!!animate);
}

function exportCSV(){
  const rows = [['journal_type','demo_trade','date','time','day_of_week','symbol','rating','direction','model','po3','entry_timeframe','outcome','risk_reward','r_multiple','draw_on_liquidity','notes']];
  state.trades.map(withDerived).forEach(t=>{
    rows.push([JOURNAL_LABELS[t.journalType], t.journalType==='live'?(t.demo==='yes'?'Yes':'No'):'—', t.date, t.time||'', DOW[t.dow], t.symbol, t.rating, t.direction, t.model, t.po3, t.entryTf, outcomeMeta(t.outcome).label, rrLabel(t.rr), t.r.toFixed(2), t.dol||'', (t.notes||'').replace(/\n/g,' ')]);
  });
  const csv = rows.map(r=>r.map(v=>{ const s = String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='trade_log.csv'; a.click();
  URL.revokeObjectURL(url);
}
async function deleteTrade(id){
  const ok = await confirmDialog({ title:'Delete this trade?', message:'You can undo for a few seconds after deleting.', okText:'Delete', danger:true });
  if(!ok) return;
  const idx = state.trades.findIndex(t=>t.id===id);
  if(idx<0) return;
  const removed = state.trades[idx];
  state.trades.splice(idx,1);
  SFX.del(); haptic('heavy');
  renderMain(false,{swap:true});
  await saveTrades();
  toast('Trade deleted', 'warn', { action:'Undo', onAction: async ()=>{
    state.trades.splice(Math.min(idx, state.trades.length), 0, removed);
    SFX.undo(); haptic('success');
    renderMain(false,{swap:true}); await saveTrades(); toast('Trade restored', 'ok');
  }});
}

function renderDimTable(trades, dimKey){
  const dim = DIMENSIONS[dimKey];
  const g = groupBy(trades, dim.get);

/* ============================= CALENDAR ============================= */
/* One month at a time, in two views that share the month picker in the header:

function dayInfo(list){
  const counted = list.filter(t=>t.outClass!=='be');
  const wins = counted.filter(t=>t.outClass==='win').length;
  const wr = counted.length ? wins/counted.length*100 : null;
  const tone = !list.length ? 'none' : wr===null ? 'be' : wr>=50 ? 'win' : 'loss';
  return { count:list.length, wins, losses:counted.length-wins, decisive:counted.length, wr, tone, level: list.length ? Math.min(4, list.length) : 0 };
}
function dayInfoLine(info){

/* ---------- Trade City (3D buildings ⇄ 2D month calendar) ---------- */
/* Each day is a proper rounded column: a rounded-square footprint extruded upward. The walls are the
   outline of footprint + roof together, shaded with a soft light→dark sweep around the curved front
   corner, so the edges read as genuinely round instead of separately-bent faces.
   Interaction never moves geometry in 3D (no jumping under the cursor): hover = glow + brighter roof,
   pick = a ring that ripples out + a pulsing outline. In 2D the hovered square swells a little. */
const SVGNS = 'http://www.w3.org/2000/svg';
const lerp = (a, b, p)=> a + (b-a)*p;
const cLerp = (a, b, p)=> a.map(([x,y],i)=>[x + (b[i][0]-x)*p, y + (b[i][1]-y)*p]);
const cDateLabel = (iso)=> prettyDate(iso);
const RR_SEG = 5;                                            /* points per rounded corner */
/* Points around a rounded rectangle, clockwise from the top-left corner (same order for every shape,
   so the 2D squares and the 3D roofs morph point-for-point). */
function rrPoints(x, y, w, h, r){
  r = Math.max(0, Math.min(r, w/2, h/2));
  const pts = [], C = [[x+r, y+r, Math.PI], [x+w-r, y+r, 1.5*Math.PI], [x+w-r, y+h-r, 0], [x+r, y+h-r, .5*Math.PI]];
  C.forEach(([cx, cy, a0])=>{ for(let k=0; k<=RR_SEG; k++){ const a = a0 + (Math.PI/2)*k/RR_SEG; pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a)]); } });
  return pts;
}
const ptsPath = (pts)=> 'M' + pts.map(p=> p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L') + 'Z';
function hull(points){
  const p = points.slice().sort((a,b)=> a[0]-b[0] || a[1]-b[1]);
  const cross = (o,a,b)=> (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = [], up = [];
  for(const q of p){ while(lo.length>=2 && cross(lo[lo.length-2], lo[lo.length-1], q) <= 0) lo.pop(); lo.push(q); }
  for(let i=p.length-1; i>=0; i--){ const q = p[i]; while(up.length>=2 && cross(up[up.length-2], up[up.length-1], q) <= 0) up.pop(); up.push(q); }
  return lo.slice(0,-1).concat(up.slice(0,-1));
}
const easeOutCubic = (t)=> 1 - Math.pow(1-t, 3);
const city = { view:'city', yaw:Math.PI/6, selected:null, progress:1, width:0, height:380,
  blocks:[], available:[], byDay:{}, rows:5, nodes:{}, parts:{}, order:'', ro:null, raf:0, morphRaf:0, anim:0, drag:null, skipClick:false,
  hover:null, riseT0:0, riseOn:false, riseMode:'wave', fromZ:null, curZ:null, key:'' };
function cityTeardown(){
  if(city.ro){ city.ro.disconnect(); city.ro = null; }
  cancelAnimationFrame(city.raf); cancelAnimationFrame(city.morphRaf); cancelAnimationFrame(city.anim);
  city.raf = city.morphRaf = city.anim = 0;
  city.drag = null; city.hover = null; city.riseOn = false;
}
function cityShellHtml(){

      <div class="fc-heading"><span class="fc-emblem">${ICONS.box}</span><div><h2>Trade City</h2><p>One day, one building. Taller means more trades — blue means you won at least half.</p></div></div>

          <button type="button" data-v="heatmap" aria-pressed="${city.view==='heatmap'}" data-silent>${ICONS.grid}<span>2D</span></button>

    </header>

      <div><span><i class="w"></i>50%+ win rate</span><span><i class="l"></i>Under 50%</span><span><i class="b"></i>Breakeven only</span><span><i></i>No trades</span></div></div>

function cityRiseOf(b, now){
  if(!city.riseOn) return 1;
  const t = city.riseMode==='morph' ? (now - city.riseT0) / 420 : (now - city.riseT0 - (b.column + b.row)*28) / 320;
  return t <= 0 ? 0 : t >= 1 ? 1 : t;
}
const CITY_S = .8, CITY_R = .17;
const cityZ = (b)=> b.future ? .04 : (b.info.count ? .3 + Math.min(b.info.count, 6)*.32 : .07);
function cityGeometry(now){
  const W = city.width, H = city.height, yaw = city.yaw, rows = city.rows;
  const cs = Math.cos(yaw), sn = Math.sin(yaw);
  const project = (x, y, z=0)=> [x*cs - y*sn, (x*sn + y*cs)*.5 - z];
  /* fit to the box using the full-height corners (stable scale while buildings rise) */
  const corners = [];
  city.blocks.forEach(b=>{ const x = b.column, y = b.row, z = cityZ(b);
    [[x,y],[x+CITY_S,y],[x+CITY_S,y+CITY_S],[x,y+CITY_S]].forEach(([px,py])=>{ corners.push(project(px,py,0), project(px,py,z)); }); });
  const gPlan = rrPoints(-.32, -.32, 7.44, rows + .44, .55);
  gPlan.forEach(([px,py])=> corners.push(project(px,py,0), project(px,py,-.16)));
  const minX = Math.min(...corners.map(p=>p[0])), maxX = Math.max(...corners.map(p=>p[0]));
  const minY = Math.min(...corners.map(p=>p[1])), maxY = Math.max(...corners.map(p=>p[1]));
  const scale = Math.min((W-28)/(maxX-minX), (H-22)/(maxY-minY));
  const offX = (W - (maxX-minX)*scale)/2, offY = (H - (maxY-minY)*scale)/2;
  const fit = ([x,y])=> [(x-minX)*scale + offX, (y-minY)*scale + offY];
  const padX = 4, padT = 30, padB = 4, gap = W < 480 ? 5 : 8;
  const cw = (W - padX*2) / 7, ch = (H - padT - padB) / rows;
  const r2 = Math.min(16, Math.min(cw, ch)*.2);
  return {
    groundTop: gPlan.map(([px,py])=> fit(project(px,py,0))),
    groundBot: gPlan.map(([px,py])=> fit(project(px,py,-.16))),
    cw, ch, gap, padX, padT, scale,
    blocks: city.blocks.map(b=>{
      const t = cityRiseOf(b, now), morph = city.riseOn && city.riseMode==='morph';
      const z = morph ? lerp(city.fromZ[b.date] != null ? city.fromZ[b.date] : .07, cityZ(b), easeOutCubic(t)) : cityZ(b) * (t ? easeOutCubic(t) : 0);
      const plan = rrPoints(b.column, b.row, CITY_S, CITY_S, CITY_R);
      const x = padX + b.column*cw, y = padT + b.row*ch, w = cw-gap, h = ch-gap;
      const s = morph ? 1 : .86 + .14*(t ? easeOutCubic(t) : 0);
      return { b, rise:t,
        flat: rrPoints(x + w*(1-s)/2, y + h*(1-s)/2, w*s, h*s, r2*s),
        roof: plan.map(([px,py])=> fit(project(px,py,z))),
        base: plan.map(([px,py])=> fit(project(px,py,0))),
        depth: b.column*sn + b.row*cs };
    }).sort((a,c)=> a.depth - c.depth),
  };
}
function cityMount(){
  const plot = document.getElementById('fcPlot'); if(!plot) return;
  const byDay = groupBy(categoryTrades().map(withDerived), t=>t.date);
  Object.values(byDay).forEach(list=> list.sort((a,b)=> (a.time||'').localeCompare(b.time||'')));
  city.byDay = byDay;
  city.width = Math.max(240, plot.getBoundingClientRect().width);
  city.progress = city.view==='city' ? 1 : 0;
  /* Same month re-rendered (e.g. switching Real / Demo / Backtest): glide every building from its
     old height to the new one. A new month or opening the tab plays the entrance wave instead. */
  const prevKey = city.key, prevZ = city.curZ;
  cityBuild();
  cityBind();
  if(!renderAnimated && prevZ && prevKey===city.key) cityMorphHeights(prevZ); else cityRise();
  city.ro = new ResizeObserver(()=>{
    const w = Math.max(240, plot.getBoundingClientRect().width);
    if(Math.abs(w - city.width) < 1) return;
    city.width = w; cityBuild();
  });
  city.ro.observe(plot);
}
function cityBuild(){
  const svg = document.getElementById('fcSvg'); if(!svg) return;
  const y = state.calYear, m = state.calMonth, days = new Date(y, m+1, 0).getDate();
  const startCol = (new Date(y, m, 1).getDay() + 6) % 7;
  const today = localISO();
  city.rows = Math.ceil((startCol + days) / 7);
  city.key = `${y}-${m}`;
  city.blocks = Array.from({length: days}, (_, i)=>{
    const date = `${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`, list = city.byDay[date] || [];
    const idx = startCol + i;
    return { date, day:i+1, list, info: dayInfo(list), column: idx % 7, row: Math.floor(idx / 7), future: date > today, today: date===today };
  });
  city.curZ = {}; city.blocks.forEach(b=> city.curZ[b.date] = cityZ(b));
  city.available = city.blocks.filter(b=>!b.future);
  if(!city.available.length) city.available = city.blocks.slice(0,1);
  if(!city.selected || !city.blocks.some(b=>b.date===city.selected && !b.future)){
    const t = city.blocks.find(b=>b.today);
    const withTrades = city.available.filter(b=>b.info.count);
    city.selected = (t || withTrades[withTrades.length-1] || city.available[city.available.length-1]).date;
  }
  city.height = city.width < 480 ? 300 : city.width < 760 ? 340 : 400;
  svg.setAttribute('viewBox', `0 0 ${city.width} ${city.height}`);
  svg.setAttribute('height', city.height);
  svg.textContent = '';
  city.nodes = {}; city.parts = {}; city.order = '';
  const gd = document.createElementNS(SVGNS, 'defs');

    if(b.future) g.setAttribute('data-future','');
    /* per-block gradients live inside the block so they inherit its --fc-top colour */

    }
    const stops = defs.querySelectorAll('#fcw'+i+' stop');
    city.nodes[b.date] = g; city.parts[b.date] = { wall, roof, day, wr, cnt, narrow, grad: defs.querySelector('#fcw'+i), stops };

  svg.appendChild(city.axis);
  const L0 = cityGeometry(performance.now());
  city.axis.innerHTML = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((n,c)=>`<text x="${(L0.padX + c*L0.cw + (L0.cw-L0.gap)/2).toFixed(1)}" y="${(L0.padT-11).toFixed(1)}" text-anchor="middle">${n}</text>`).join('');

}
function cityUpdate(){
  const svg = document.getElementById('fcSvg'); if(!svg || !city.blocks.length) return;
  const p = city.progress, q = Math.max(0, 1 - p*2.2);
  const L = cityGeometry(performance.now());
  city.ground.setAttribute('d', ptsPath(L.groundTop)); city.ground.style.opacity = p;
  city.groundSide.setAttribute('d', ptsPath(hull(L.groundTop.concat(L.groundBot)))); city.groundSide.style.opacity = p;
  let selRoof = null;
  const fs2 = Math.max(11, Math.min(13.5, L.ch*.24)), fs3 = Math.max(8, Math.min(11.5, L.scale*.3));
  const fsW = Math.max(12, Math.min(22, L.ch*.34, (L.cw - L.gap)*.24));
  L.blocks.forEach(o=>{
    const roof = cLerp(o.flat, o.roof, p), base = cLerp(o.flat, o.base, p);
    const P = city.parts[o.b.date], g = city.nodes[o.b.date];
    const wall = hull(roof.concat(base));
    P.wall.setAttribute('d', ptsPath(wall));
    P.roof.setAttribute('d', ptsPath(roof));
    /* light → dark sweep across the walls, turning over at the front-most point of the base */
    let mn = Infinity, mx = -Infinity, front = base[0];
    wall.forEach(pt=>{ if(pt[0] < mn) mn = pt[0]; if(pt[0] > mx) mx = pt[0]; });
    base.forEach(pt=>{ if(pt[1] > front[1]) front = pt; });
    const span = Math.max(1, mx - mn), t = Math.max(.05, Math.min(.95, (front[0] - mn)/span)), band = Math.min(.18, Math.max(.04, CITY_R*L.scale*.9/span));
    P.grad.setAttribute('x1', mn.toFixed(1)); P.grad.setAttribute('x2', mx.toFixed(1));
    P.stops[1].setAttribute('offset', (t - band).toFixed(3)); P.stops[2].setAttribute('offset', (t + band).toFixed(3));
    g.style.opacity = (o.rise < 1 && city.riseMode!=='morph') ? (.12 + .88*o.rise).toFixed(3) : '';
    const fx = o.flat[0][0] - (L.cw - L.gap)*0, xs = o.flat.map(pt=>pt[0]), ys = o.flat.map(pt=>pt[1]);
    const bx = Math.min(...xs), by = Math.min(...ys), fw = Math.max(...xs) - bx, fh = Math.max(...ys) - by;
    let cx = 0, cy = 0; o.roof.forEach(pt=>{ cx += pt[0]; cy += pt[1]; }); cx /= o.roof.length; cy /= o.roof.length;
    const fs = lerp(fs2, fs3, p), nd = String(o.b.day).length;
    P.day.setAttribute('x', lerp(bx + (P.narrow ? 7 : 11), cx - nd*fs3*.3, p).toFixed(1));
    P.day.setAttribute('y', lerp(by + fs2 + 6, cy + fs3*.36, p).toFixed(1));
    P.day.setAttribute('font-size', fs.toFixed(1));
    if(P.wr){
      P.wr.setAttribute('x', (P.narrow ? bx + fw/2 : bx + 11).toFixed(1));
      P.wr.setAttribute('y', (by + fh - Math.max(7, fh*.15)).toFixed(1));
      P.wr.setAttribute('font-size', (P.narrow ? Math.min(fsW, fw*.27) : fsW).toFixed(1));
      P.wr.style.opacity = q;
    }
    if(P.cnt){
      P.cnt.setAttribute('x', (bx + fw - 11).toFixed(1)); P.cnt.setAttribute('y', (by + fs2 + 5).toFixed(1));
      P.cnt.setAttribute('font-size', Math.max(10, fs2*.85).toFixed(1));
      P.cnt.style.opacity = q;
    }
    if(o.b.date === city.selected) selRoof = roof;
  });
  let order = L.blocks.map(o=>o.b.date);
  if(p < .5 && city.hover){ order = order.filter(d=>d!==city.hover); order.push(city.hover); }
  const key = order.join(',');
  if(key !== city.order){
    city.order = key;
    const frag = document.createDocumentFragment();
    order.forEach(dt=> frag.appendChild(city.nodes[dt]));
    svg.insertBefore(frag, city.axis);
  }
  if(selRoof){ city.sel.setAttribute('d', ptsPath(selRoof)); if(city.sel.parentNode !== city.nodes[city.selected]) city.nodes[city.selected].appendChild(city.sel); }
  city.axis.style.opacity = 1 - p;
}
function cityRequest(){ if(!city.raf) city.raf = requestAnimationFrame(()=>{ city.raf = 0; cityUpdate(); }); }
/* entrance wave only — interaction never animates geometry */
function cityTick(t){
  city.anim = 0;
  if(city.riseOn && t - city.riseT0 > (city.riseMode==='morph' ? 440 : (6 + city.rows)*28 + 340)) city.riseOn = false;
  cityUpdate();
  if(city.riseOn) city.anim = requestAnimationFrame(cityTick);
}
function cityMorphHeights(fromZ){
  cancelAnimationFrame(city.anim); city.anim = 0;
  if(reducedMotion()){ city.riseOn = false; cityUpdate(); return; }
  city.riseMode = 'morph'; city.fromZ = fromZ; city.riseOn = true; city.riseT0 = performance.now();
  cityUpdate(); city.anim = requestAnimationFrame(cityTick);
}
function cityRise(){
  cancelAnimationFrame(city.anim); city.anim = 0;
  city.riseMode = 'wave';
  if(reducedMotion()){ city.riseOn = false; cityUpdate(); return; }
  city.riseOn = true; city.riseT0 = performance.now();
  cityUpdate(); city.anim = requestAnimationFrame(cityTick);
}
function cityPlacePill(animate){
  const sw = document.getElementById('fcSwitch'); if(!sw) return;
  let pill = sw.querySelector('.seg-pill');
  if(!pill){ pill = document.createElement('span'); pill.className = 'seg-pill'; sw.prepend(pill); }
  const a = sw.querySelector('button[aria-pressed="true"]'); if(!a) return;
  if(!animate) pill.style.transition = 'none';
  pill.style.width = a.offsetWidth+'px'; pill.style.transform = `translateX(${a.offsetLeft - 3}px)`;
  if(!animate){ void pill.offsetWidth; pill.style.transition = ''; }
}
function cityMorph(view){
  city.view = view;
  const plot = document.getElementById('fcPlot'); if(plot) plot.dataset.view = view;
  document.querySelectorAll('#fcSwitch button').forEach(b=> b.setAttribute('aria-pressed', String(b.dataset.v===view)));
  cityPlacePill(true);
  const note = document.getElementById('fcLegendNote'); if(note) note.textContent = view==='city' ? 'One day. One building.' : 'One day. One square.';
  cityHint(); cityTip(null);
  const target = view==='city' ? 1 : 0;
  cancelAnimationFrame(city.morphRaf);
  if(reducedMotion()){ city.progress = target; cityUpdate(); return; }
  const from = city.progress, start = performance.now();
  const step = (time)=>{
    const e = Math.min(1, (time - start)/300), eased = e < 1 ? 1 - Math.pow(1-e, 4) : 1;
    city.progress = from + (target - from)*eased;
    cityUpdate();
    if(e < 1) city.morphRaf = requestAnimationFrame(step);
  };
  city.morphRaf = requestAnimationFrame(step);
}
function cityStats(){
  const el = document.getElementById('fcStats'); if(!el) return;
  const trades = city.blocks.flatMap(b=>b.list);
  const s = computeStats(trades);
  const tradingDays = city.blocks.filter(b=>b.info.count).length;
  let streak = 0, best = 0;
  city.blocks.forEach(b=>{ if(b.info.tone==='win'){ streak++; best = Math.max(best, streak); } else if(b.info.tone==='loss') streak = 0; });
  el.innerHTML = `
    <div><span>Win rate</span><strong class="num"><span class="${wrClass(s.winRate, s.n)}">${s.n ? fmtPct(s.winRate) : '—'}</span></strong><small>${MONTH_NAMES[state.calMonth]} ${state.calYear}</small></div>
    <div><span>Trades</span><strong class="num">${trades.length}<em> on ${tradingDays} day${tradingDays===1?'':'s'}</em></strong><small>${s.wins}W · ${s.losses}L · ${s.be}BE</small></div>
    <div><span>Best streak</span><strong class="num">${best}<em> day${best===1?'':'s'}</em></strong><small>winning days in a row</small></div>`;
}
function cityHint(){
  const el = document.getElementById('fcHint'); if(!el) return;
  const changed = Math.abs(city.yaw - Math.PI/6) > .005;
  el.innerHTML = (city.view==='city' ? 'Drag to orbit' : 'Select a day') + (changed && city.view==='city' ? `<button class="fc-camera" type="button" id="fcReset" aria-label="Reset city angle" data-silent>${ICONS.rotate}</button>` : '');
  const r = document.getElementById('fcReset'); if(r) r.onclick = ()=>{ city.yaw = Math.PI/6; cityUpdate(); cityHint(); SFX.swoosh(); };
}
function cityDayPanel(){
  const row = document.getElementById('fcDay'), list = document.getElementById('fcList'); if(!row || !list) return;
  const idx = city.available.findIndex(b=>b.date===city.selected);
  const b = city.available[Math.max(0, idx)];
  row.innerHTML = `
    <div class="fc-day-identity"><span class="fc-day-icon">${ICONS.clock}</span><div aria-live="polite" aria-atomic="true"><strong>${cDateLabel(b.date)}</strong><span>${dayInfoLine(b.info)}</span></div></div>
