<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Futures Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0071e3">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Journal">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#f5f5f7;
    --surface:#ffffff;
    --surface-2:#f5f5f7;
    --surface-3:#ebebf0;
    --border:#d2d2d7;
    --border-soft:#e5e5ea;
    --text:#1d1d1f;
    --text-dim:#6e6e73;
    --text-faint:#86868b;
    --gold:#0071e3;
    --gold-dim:#e8f1fd;
    --gain:#2fb350;
    --gain-dim:#e6f8ea;
    --loss:#ff3b30;
    --loss-dim:#ffe9e7;
    --blue:#0071e3;
    --radius-s:8px;
    --radius-m:14px;
    --radius-l:20px;
    --shadow-card:0 1px 2px rgba(0,0,0,.04), 0 1px 8px rgba(0,0,0,.03);
  }
  html[data-theme="dark"]{
    --bg:#111113;
    --surface:#1c1c1f;
    --surface-2:#232327;
    --surface-3:#2c2c31;
    --border:#3a3a3f;
    --border-soft:#2a2a2e;
    --text:#f2f2f4;
    --text-dim:#a1a1a6;
    --text-faint:#7d7d82;
    --gold:#3b93ff;
    --gold-dim:#122844;
    --gain:#32d74b;
    --gain-dim:#0f2818;
    --loss:#ff453a;
    --loss-dim:#3a1210;
    --blue:#3b93ff;
    --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 1px 10px rgba(0,0,0,.25);
  }
  html{background:var(--bg);}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;padding-top:env(safe-area-inset-top);}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    transition:background-color .25s ease, color .25s ease;
  }
  ::selection{background:var(--gold-dim);color:var(--gold);}
  .num{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}
  .serif{font-family:'Inter',sans-serif;font-weight:700;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:2px solid var(--bg);}

  #app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:230px;
    flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border-soft);
    display:flex;
    flex-direction:column;
    padding:22px 16px;
    position:sticky;
    top:0;
    height:100vh;
    transition:background-color .25s ease, border-color .25s ease;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:4px 8px 22px 8px;
    border-bottom:1px solid var(--border-soft);
    margin-bottom:18px;
  }
  .brand-mark{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--text);
    letter-spacing:-0.2px;
  }
  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;
    align-items:center;
    gap:11px;
    padding:9px 12px;
    border-radius:var(--radius-s);
    color:var(--text-dim);
    cursor:pointer;
    font-size:13.5px;
    font-weight:500;
    transition:background .12s ease, color .12s ease;
    user-select:none;
  }
  .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.85;}
  .nav-item:hover{background:var(--surface-2);color:var(--text);}
  .nav-item.active{background:var(--gold-dim);color:var(--gold);}
  .nav-item.active svg{opacity:1;}
  .nav-divider{height:1px;background:var(--border-soft);margin:14px 4px;}
  .sidebar-foot{margin-top:auto;padding:12px 8px 0 8px;border-top:1px solid var(--border-soft);}
  .btn-add-sidebar{
    margin-top:14px;
    width:100%;
    background:var(--gold);
    color:#fff;
    border:none;
    padding:10px 0;
    border-radius:999px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    transition:filter .12s ease;
  }
  .btn-add-sidebar:hover{filter:brightness(1.06);}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;padding:34px 40px 60px 40px;max-width:1440px;}
  @keyframes pageFadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .page-fade{animation:pageFadeIn .25s ease;}
  .page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:14px;}
  .page-title{font-family:'Inter',sans-serif;font-size:26px;font-weight:700;margin:0 0 4px 0;letter-spacing:-0.3px;}
  .page-subtitle{color:var(--text-dim);font-size:13px;margin:0;}
  .header-actions{display:flex;gap:10px;align-items:center;}

  .segmented{display:flex;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:999px;padding:3px;gap:2px;}
  .segmented button{
    background:transparent;border:none;color:var(--text-dim);
    padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:500;cursor:pointer;
    transition:background .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .segmented button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-card);}

  .btn-primary{
    background:var(--gold);color:#fff;border:none;padding:9px 18px;border-radius:999px;
    font-weight:600;font-size:13px;cursor:pointer;transition:filter .15s ease, transform .12s ease;
  }
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-primary:active{transform:scale(.96);}
  .btn-secondary{
    background:var(--surface);color:var(--text);border:1px solid var(--border);padding:8px 14px;border-radius:999px;
    font-weight:500;font-size:13px;cursor:pointer;transition:background-color .15s ease, border-color .15s ease, transform .12s ease;
  }
  .btn-secondary:hover{background:var(--surface-2);}
  .btn-secondary:active{transform:scale(.96);}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:7px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;transition:color .15s ease, border-color .15s ease, transform .12s ease;}
  .btn-ghost:hover{color:var(--text);border-color:var(--text-faint);}
  .btn-ghost:active{transform:scale(.96);}
  .btn-danger{color:var(--loss);}

  /* ---------- KPI grid ---------- */
  .kpi-row{display:grid;grid-template-columns:1.4fr repeat(4, 1fr);gap:14px;margin-bottom:20px;}
  .kpi-hero{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-l);
    padding:22px 24px;
    display:flex;flex-direction:column;justify-content:center;gap:6px;
    box-shadow:var(--shadow-card);
  }
  .kpi-hero .lbl{font-size:12px;color:var(--text-dim);font-weight:500;}
  .kpi-hero .val{font-family:'Inter',sans-serif;font-size:36px;font-weight:800;line-height:1;letter-spacing:-0.5px;}
  .kpi-hero .sub{font-size:12px;color:var(--text-faint);margin-top:2px;}
  .kpi-card{
    background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-m);
    padding:16px 17px;display:flex;flex-direction:column;justify-content:center;gap:5px;
    box-shadow:var(--shadow-card);
  }
  .kpi-card .lbl{font-size:11.5px;color:var(--text-dim);font-weight:500;}
  .kpi-card .val{font-family:'Inter',sans-serif;font-size:20px;font-weight:700;}
  .kpi-card .sub{font-size:11px;color:var(--text-faint);}
  .cat-card{cursor:pointer;transition:border-color .18s ease,transform .15s ease,box-shadow .18s ease;}
  .cat-card:hover{border-color:var(--text-faint);transform:translateY(-2px);}
  .cat-card:active{transform:translateY(0) scale(.99);}
  .cat-card.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,var(--shadow-card);}
  .cat-card .tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);}
  .pos{color:var(--gain);}
  .neg{color:var(--loss);}
  .neu{color:var(--text-dim);}

  /* ---------- Panels / charts ---------- */
  .panel-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:14px;margin-bottom:14px;}
  .panel-grid.thirds{grid-template-columns:1fr 1fr 1fr;}
  .panel-grid.halves{grid-template-columns:1fr 1fr;}
  .panel{
    background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-m);
    padding:18px 20px;box-shadow:var(--shadow-card);
    transition:background-color .25s ease, border-color .25s ease;
  }
  .panel-title{font-size:13.5px;font-weight:700;margin:0 0 2px 0;}
  .panel-note{font-size:11.5px;color:var(--text-faint);margin:0 0 14px 0;}
  .chart-wrap{position:relative;width:100%;}
  .chart-wrap canvas{max-width:100%;}

  /* ---------- Table ---------- */
  .table-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  input[type=text],input[type=search],select,input[type=number],input[type=date],input[type=time]{
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    padding:8px 10px;border-radius:var(--radius-s);font-size:13px;font-family:inherit;
    outline:none;transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim);}
  textarea{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-s);padding:9px 10px;font-family:inherit;font-size:13px;outline:none;resize:vertical;transition:border-color .15s ease, box-shadow .15s ease;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.2;}
  thead th{
    text-align:left;color:var(--text-faint);font-weight:600;font-size:11px;
    padding:8px 10px 10px 10px;border-bottom:1px solid var(--border-soft);
    position:sticky;top:0;background:var(--surface);cursor:pointer;user-select:none;
    white-space:nowrap;transition:color .15s ease;
  }
  thead th:hover{color:var(--text-dim);}
  tbody td{padding:6px 10px;line-height:1.2;vertical-align:middle;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
  tbody td.notes-cell,tbody td.psych-cell{white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;}
  tbody tr{cursor:pointer;transition:background-color .15s ease;}
  tbody tr:hover{background:var(--surface-2);}
  .table-scroll{max-height:600px;overflow:auto;border-radius:var(--radius-s);}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
  .badge.long{background:var(--gain-dim);color:var(--gain);}
  .badge.short{background:var(--loss-dim);color:var(--loss);}
  .badge.win{background:var(--gain-dim);color:var(--gain);}
  .badge.loss{background:var(--loss-dim);color:var(--loss);}
  .badge.be_win{background:var(--gold-dim);color:var(--gold);}
  .badge.be_loss{background:var(--surface-3);color:var(--text-dim);}
  .badge.dim{background:var(--surface-3);color:var(--text-dim);}
  .badge.rating-Aplus,.badge.rating-A{background:var(--gain-dim);color:var(--gain);}
  .badge.rating-B{background:var(--gold-dim);color:var(--gold);}
  .badge.rating-C{background:var(--surface-3);color:var(--text-dim);}
  .badge.rating-F{background:var(--loss-dim);color:var(--loss);}
  .badge.demo{background:var(--gold-dim);color:var(--gold);}
  .badge.real{background:var(--surface-3);color:var(--text-dim);}
  .badge.journal-backtest{background:var(--surface-3);color:var(--text-dim);}
  .tag{display:inline-block;background:var(--surface-3);color:var(--text-dim);font-size:10.5px;padding:2px 7px;border-radius:5px;margin:1px 3px 1px 0;}
  .row-actions{display:flex;gap:6px;opacity:0;transition:opacity .15s ease;}
  tbody tr:hover .row-actions{opacity:1;}
  .icon-btn{background:none;border:none;color:var(--text-faint);cursor:pointer;padding:3px;border-radius:4px;transition:color .15s ease, background-color .15s ease, transform .12s ease;}
  .icon-btn:hover{color:var(--text);background:var(--surface-3);}
  .icon-btn:active{transform:scale(.88);}
  .icon-btn svg{width:14px;height:14px;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--text-faint);}
  .empty-state .serif{font-size:19px;color:var(--text-dim);display:block;margin-bottom:6px;}

  /* ---------- Modal ---------- */
  @keyframes overlayFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes overlayFadeOut{from{opacity:1;}to{opacity:0;}}
  @keyframes modalPopIn{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes modalPopOut{from{opacity:1;transform:translateY(0) scale(1);}to{opacity:0;transform:translateY(8px) scale(.97);}}
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
    animation:overlayFadeIn .18s ease;
  }
  .overlay.closing{animation:overlayFadeOut .16s ease forwards;}
  .modal{
    background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-l);
    width:680px;max-width:100%;max-height:90vh;overflow:auto;padding:26px 28px 24px 28px;
    box-shadow:0 20px 60px rgba(0,0,0,.18);
    animation:modalPopIn .22s cubic-bezier(.2,.9,.3,1);
  }
  .overlay.closing .modal{animation:modalPopOut .16s ease forwards;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .modal-head h2{font-family:'Inter',sans-serif;font-weight:700;font-size:20px;margin:0;letter-spacing:-0.3px;}
  .close-x{background:none;border:none;color:var(--text-faint);font-size:20px;cursor:pointer;line-height:1;transition:color .15s ease, transform .12s ease;}
  .close-x:hover{color:var(--text);transform:rotate(90deg);}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
  .form-field{display:flex;flex-direction:column;gap:5px;}
  .form-field.span2{grid-column:1/-1;}
  .form-field label{font-size:11.5px;color:var(--text-dim);font-weight:500;}
  .form-field .dow-hint{font-size:11px;color:var(--gold);margin-top:2px;}
  .time-select-row{display:flex;align-items:center;gap:6px;}
  .time-select-row select{flex:1;min-width:0;}
  .time-select-row .time-sep{color:var(--text-faint);font-weight:600;}
  .tz-hint{font-size:10.5px;color:var(--text-faint);margin-top:2px;}
  .toggle-row{display:flex;gap:8px;}
  .toggle-btn{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);padding:8px 0;border-radius:var(--radius-s);font-size:12.5px;font-weight:600;cursor:pointer;text-align:center;transition:background-color .15s ease, color .15s ease, border-color .15s ease, transform .12s ease;}
  .toggle-btn.active{background:var(--gold-dim);color:var(--gold);border-color:var(--gold);}
  .toggle-btn:active{transform:scale(.97);}
  .form-preview{
    grid-column:1/-1;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-s);
    padding:12px 14px;display:flex;gap:22px;margin-top:2px;flex-wrap:wrap;
  }
  .form-preview .fp-item .fp-lbl{font-size:10.5px;color:var(--text-faint);}
  .form-preview .fp-item .fp-val{font-family:'Inter',sans-serif;font-size:16px;font-weight:700;}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

  /* ---------- Image upload slots ---------- */
  .img-upload-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .img-slot{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-s);padding:8px;display:flex;flex-direction:column;gap:6px;}
  .img-slot-label{font-size:10.5px;color:var(--text-faint);}
  .img-slot-thumb{width:100%;height:80px;object-fit:cover;border-radius:6px;cursor:zoom-in;display:block;}
  .img-slot-empty{width:100%;height:80px;border-radius:6px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:10.5px;text-align:center;padding:4px;}
  .img-slot-actions{display:flex;gap:6px;}
  .img-slot-actions .btn-ghost{flex:1;font-size:11px;padding:5px 0;text-align:center;}

  /* ---------- Trade detail modal ---------- */
  .detail-modal{width:760px;}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 16px;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--border-soft);}
  .detail-item-lbl{font-size:10.5px;color:var(--text-faint);margin-bottom:3px;}
  .detail-item-val{font-size:13.5px;font-weight:600;}
  .detail-block{margin-bottom:16px;}
  .detail-block-lbl{font-size:11.5px;color:var(--text-dim);font-weight:600;margin-bottom:6px;}
  .detail-block-text{font-size:13px;white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-s);padding:12px 14px;line-height:1.65;}
  .detail-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .detail-img-card{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-s);padding:8px;}
  .detail-img-lbl{font-size:10.5px;color:var(--text-faint);margin-bottom:6px;}
  .detail-img-thumb{width:100%;border-radius:6px;cursor:zoom-in;display:block;object-fit:cover;max-height:160px;}
  .img-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;}
  .img-lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5);}
  .img-lightbox .lightbox-close{position:absolute;top:18px;right:22px;color:#fff;font-size:28px;line-height:1;cursor:pointer;opacity:.8;}
  .img-lightbox .lightbox-close:hover{opacity:1;}

  /* ---------- Analytics dimension grid ---------- */
  .dim-table-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;}
  .dim-table-card{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-s);padding:12px 14px;}
  .dim-table-card .dim-table-title{font-size:12px;font-weight:700;margin:0 0 8px 0;color:var(--text);}
  .dim-table-card table{font-size:11.5px;}
  .dim-table-card td,.dim-table-card th{padding:6px 6px;}

  /* ---------- Calendar ---------- */
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .cal-nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .cal-nav select,.cal-nav input[type=number]{padding:6px 8px;font-size:12.5px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{text-align:center;font-size:11px;color:var(--text-faint);padding-bottom:4px;}
  .cal-cell{
    aspect-ratio:1.15/1;border-radius:var(--radius-s);border:1px solid var(--border-soft);
    padding:7px 8px;display:flex;flex-direction:column;justify-content:space-between;
    cursor:pointer;overflow:hidden;min-height:0;min-width:0;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease, background-color .3s ease;
  }
  .cal-cell:hover{transform:translateY(-2px);border-color:var(--text-faint);box-shadow:var(--shadow-card);}
  .cal-cell:active{transform:translateY(0);}
  .cal-cell.empty{visibility:hidden;}
  .cal-cell .d{font-size:11px;color:var(--text-faint);}
  .cal-cell .p{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-cell .n{font-size:9.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-faint);margin-top:14px;flex-wrap:wrap;}
  .legend .sw{width:12px;height:12px;border-radius:3px;}

  .footer-note{text-align:center;color:var(--text-faint);font-size:11.5px;margin-top:40px;}
  .dim-select{margin-bottom:14px;}

  @media (max-width: 1100px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .kpi-hero{grid-column:1/-1;}

<div id="app"></div>

<script>
/* ============================= CONSTANTS ============================= */
const SYMBOLS = {
  'NQ' : {name:'Nasdaq-100 (NQ)'},
  'ES' : {name:'S&P 500 (ES)'},
  'MNQ' : {name:'Micro Nasdaq (MNQ)'},
  'MES' : {name:'Micro S&P (MES)'},
};
const RATINGS = ['A+','A','B','C','F'];
const PO3_WINDOWS = ['9:30+9:45','10:00','10:00+10:15','10:00+10:30','10:30','10:30+10:45'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MODELS = ['BNQ','PDI','Mechanical','Continuation','Pattie Swing'];
const TIMEFRAMES = ['15s','30s','1m','2m','3m','4m','5m'];
const DOL_OPTIONS = ['Session liquidity','Equal High/Low','1:1 risk-reward','Data High/Low','High Resistance Liquidity','Low Resistance Liquidity','External Range Liquidity','Imbalance','Previous day high/low'];
const OUTCOMES = {
  win:     {label:'Win',                class:'win'},
  loss:    {label:'Loss',               class:'loss'},
  be_win:  {label:'Breakeven → Win',    class:'be_win'},
  be_loss: {label:'Breakeven → Loss',   class:'be_loss'},

/* Defensive accessor: some older/imported trades may carry an outcome value
   that no longer exists in OUTCOMES (e.g. legacy data, manual edits, or a
   corrupted record). Fall back to a visible "Unknown" badge instead of
   throwing, so a single bad record can't break the whole page. */
function outcomeMeta(o){ return OUTCOMES[o] || {label:'Unknown', class:'dim'}; }
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const JOURNAL_LABELS = { live:'Trading', backtest:'Backtesting' };

/* ============================= STORAGE (Supabase, with local fallback) ============================= */
/* Primary mode: Supabase (cross-device sync via a private key/value table scoped to the
   logged-in user with Row Level Security). Falls back to localStorage if Supabase's
   library or network isn't available, so the file still works standalone if needed. */
const SUPABASE_URL = 'https://beeqyufzleajrlyaievr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_EP_axx65-rNKa1YujisFoQ_ms7Vttp3';
let sb = null;
let sbUserId = null;
let sbUserEmail = null;
let storageMode = 'memory';
let memoryStore = {};

function hasLocalStorage(){
  try{ const k='__fj_test__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; }
}

async function storageGet(key){
  if(storageMode==='supabase'){
    try{
      const { data, error } = await sb.from('kv_store').select('value').eq('key', key).maybeSingle();
      if(error) throw error;
      return data ? data.value : null;
    }catch(e){ console.error('storageGet failed', e); return null; }
  }
  if(storageMode==='local'){
    return localStorage.getItem('fj:'+key);
  }
  return memoryStore[key] || null;
}
async function storageSet(key, value){
  if(storageMode==='supabase'){
    try{
      const { error } = await sb.from('kv_store').upsert(
        { user_id: sbUserId, key, value, updated_at: new Date().toISOString() },
        { onConflict: 'user_id,key' }
      );
      if(error) throw error;
      return true;
    }catch(e){ console.error('storageSet failed', e); return false; }
  }
  if(storageMode==='local'){
    try{ localStorage.setItem('fj:'+key, value); return true; }catch(e){ return false; }
  }
  memoryStore[key] = value; return true;
}

/* ---- Auth gate: shows a sign-in screen until a Supabase session exists ---- */
function renderAuthScreen(onDone){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="auth-screen"><div class="auth-card">
      <h1>Futures Journal</h1>
      <p>Sign in to sync your trades across every device.</p>
      <input id="authEmail" type="email" placeholder="Email" autocomplete="username">
      <input id="authPass" type="password" placeholder="Password" autocomplete="current-password">
      <div class="auth-error" id="authError"></div>
      <button class="btn-primary" id="authSignIn">Sign in</button>
      <button class="btn-ghost" id="authSignUp">Create account</button>
      <div class="auth-status" id="authStatus"></div>
    </div></div>`;
  const err = document.getElementById('authError');
  const status = document.getElementById('authStatus');
  const getCreds = ()=>({
    email: document.getElementById('authEmail').value.trim(),
    password: document.getElementById('authPass').value,
  });
  document.getElementById('authSignIn').onclick = async ()=>{
    err.textContent=''; status.textContent='Signing in…';
    const { email, password } = getCreds();
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    status.textContent='';
    if(error){ err.textContent = error.message; return; }
    sbUserId = data.user.id; sbUserEmail = data.user.email; storageMode='supabase';
    onDone();
  };
  document.getElementById('authSignUp').onclick = async ()=>{
    err.textContent=''; status.textContent='';
    const { email, password } = getCreds();
    if(password.length < 6){ err.textContent = 'Password must be at least 6 characters.'; return; }
    status.textContent='Creating account…';
    const { data, error } = await sb.auth.signUp({ email, password });
    status.textContent='';
    if(error){ err.textContent = error.message; return; }
    if(!data.session){ err.textContent = 'Check your email to confirm your account, then sign in.'; return; }
    sbUserId = data.user.id; sbUserEmail = data.user.email; storageMode='supabase';
    onDone();
  };
}
async function ensureAuth(){
  if(typeof window.supabase === 'undefined'){
    // Supabase library failed to load (e.g. offline) — fall back so the app still opens.
    storageMode = hasLocalStorage() ? 'local' : 'memory';
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data:{ session } } = await sb.auth.getSession();
  if(session){
    sbUserId = session.user.id; sbUserEmail = session.user.email; storageMode = 'supabase';
    return;
  }
  await new Promise(resolve => renderAuthScreen(resolve));
}
function subscribeRealtime(){
  if(storageMode!=='supabase') return;
  sb.channel('kv-changes-'+sbUserId)
    .on('postgres_changes', { event:'*', schema:'public', table:'kv_store', filter:`user_id=eq.${sbUserId}` }, async (payload)=>{
      const key = payload.new ? payload.new.key : (payload.old ? payload.old.key : null);
      if(key==='trades'){
        const v = await storageGet('trades');
        state.trades = v ? JSON.parse(v) : [];
        render();
      } else if(key==='settings'){
        const v = await storageGet('settings');
        if(v) state.settings = Object.assign(state.settings, JSON.parse(v));
        document.documentElement.setAttribute('data-theme', state.settings.theme === 'dark' ? 'dark' : 'light');
        render();
      }
    })
    .subscribe();
}
async function signOut(){
  if(storageMode==='supabase'){ try{ await sb.auth.signOut(); }catch(e){} }
  location.reload();
}

/* ============================= STATE ============================= */
let state = {
  trades: [],
  settings: { defaultRiskPerTrade: 100, theme: 'light', lastJournal: 'live', lastCategory: 'real' },
  activeTab: 'dashboard',
  journal: 'live',
  category: 'real', // 'real' | 'demo' | 'backtest' — drives Dashboard / Analytics / Calendar
  range: 'all',
  logFilters: { symbol:'all', outcome:'all', model:'all', demo:'all', search:'', sortKey:'date', sortDir:'desc' },
  calMonth: new Date().getMonth(),
  calYear: new Date().getFullYear(),
  editingId: null,
  loaded: false,
};
const charts = {};

function openImageLightbox(src){
  if(!src) return;
  const overlay = document.createElement('div');
  overlay.className = 'img-lightbox';
  overlay.innerHTML = `<span class="lightbox-close">&times;</span><img src="${src}">`;
  overlay.onclick = ()=> overlay.remove();
  document.body.appendChild(overlay);
}
function uid(){ return 't_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function truncate(s,n){ if(!s) return '—'; return s.length>n ? s.slice(0,n-1)+'…' : s; }
function truncateWords(s,n){ if(!s) return '—'; const words = s.trim().split(/\s+/); return words.length>n ? words.slice(0,n).join(' ')+'…' : s; }

async function loadData(){
  try{ const v = await storageGet('trades'); state.trades = v ? JSON.parse(v) : []; }catch(e){ state.trades = []; }
  const symbolMigration = { 'NQ1!':'NQ', 'ES1!':'ES' };
  state.trades.forEach(t=>{ if(symbolMigration[t.symbol]) t.symbol = symbolMigration[t.symbol]; });
  try{ const v2 = await storageGet('settings'); if(v2) state.settings = Object.assign(state.settings, JSON.parse(v2)); }catch(e){}
  state.journal = state.settings.lastJournal === 'backtest' ? 'backtest' : 'live';
  state.category = ['real','demo','backtest'].includes(state.settings.lastCategory) ? state.settings.lastCategory : 'real';
  document.documentElement.setAttribute('data-theme', state.settings.theme === 'dark' ? 'dark' : 'light');
  state.loaded = true;
}
async function saveTrades(){ await storageSet('trades', JSON.stringify(state.trades)); }
async function saveSettings(){ await storageSet('settings', JSON.stringify(state.settings)); }

/* ============================= CALC HELPERS ============================= */
function dayOfWeek(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  return d.getDay(); // 0=Sun..6=Sat
}
function rMultiple(t){
  const rr = parseFloat(t.rr)||0;
  if(t.outcome==='win') return rr;
  if(t.outcome==='loss') return -1;
  if(t.outcome==='be_win') return 0;
  if(t.outcome==='be_loss') return 0;
  return 0;
}
function outcomeClass(t){
  if(t.outcome==='win' || t.outcome==='be_win') return 'win';
  if(t.outcome==='loss') return 'loss';
  return 'be';
}
/* Used only for the dashboard's "Outcome breakdown" donut: unlike outcomeClass
   (which counts a breakeven-then-win trade as a win for win-rate/streak purposes),
   this groups BOTH breakeven→win and breakeven→loss together as "Breakeven",
   since either way the trade was managed to breakeven and the label should
   reflect that regardless of which way price drifted afterward. */
function outcomeBreakdownCounts(trades){
  let wins=0, losses=0, be=0;
  trades.forEach(t=>{
    if(t.outcome==='be_win' || t.outcome==='be_loss') be++;
    else if(t.outcome==='win') wins++;
    else if(t.outcome==='loss') losses++;
  });
  return { wins, losses, be };
}
function tradeRisk(t){
  const own = parseFloat(t.riskPerTrade);
  if(own && own>0) return own;
  return parseFloat(state.settings.defaultRiskPerTrade)||0;
}
function dollarPnl(t){
  const base = rMultiple(t) * tradeRisk(t);
  if(t.outcome==='be_win' || t.outcome==='be_loss'){
    return base + (parseFloat(t.beAdjustment)||0);
  }
  return base;
}
function withDerived(t){
  const r = rMultiple(t);
  const journalType = t.journalType==='backtest' ? 'backtest' : 'live';
  const demo = t.demo==='yes' ? 'yes' : 'no';
  return Object.assign({}, t, {
    journalType, demo,
    r,
    pnl: dollarPnl(t),
    dow: dayOfWeek(t.date),
    outClass: outcomeClass(t),
  });
}
/* All raw trades belonging to the currently active journal (Trading vs Backtesting) —
   used by the Trade Log page, which keeps its own real/demo filter dropdown. */
function journalTrades(){
  return state.trades.filter(t => (t.journalType==='backtest' ? 'backtest' : 'live') === state.journal);
}
/* Three completely separate buckets, each with its own cash total:
   'real'     — live trades, real money, demo excluded
   'demo'     — live trades flagged as demo (paper money, tracked but never mixed into real cash)
   'backtest' — backtesting journal, hypothetical results only */
const CATEGORY_LABELS = { real:'Real trading', demo:'Demo trading', backtest:'Backtesting' };
function categoryOf(t){
  if((t.journalType==='backtest'?'backtest':'live') === 'backtest') return 'backtest';
  return t.demo==='yes' ? 'demo' : 'real';
}
function categoryTrades(cat){
  return state.trades.filter(t => categoryOf(t) === (cat || state.category));
}
/* Whether a trade's dollar value should count toward real-money totals —
   demo trades and backtest trades never count as real cash. */
function isCashable(t){ return categoryOf(t) === 'real'; }
function fmtMoney(n, showSign){
  const s = Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const sign = n<0 ? '-' : (showSign && n>0 ? '+' : '');
  return sign + '$' + s;
}
function fmtPct(n){ return n.toFixed(1) + '%'; }
function colorForPnl(n){ return n>0?'pos':(n<0?'neg':'neu'); }
function ratingClass(r){ return 'rating-' + r.replace('+','plus'); }
function rrLabel(rr){ return (Math.round(rr*100)/100) + ':1'; }

function filteredTrades(){
  let arr = categoryTrades().map(withDerived);
  const now = new Date();
  if(state.range === 'week'){
    const start = new Date(now); start.setDate(now.getDate()-7);
    arr = arr.filter(t => new Date(t.date) >= start);
  } else if(state.range === 'month'){
    arr = arr.filter(t => { const d=new Date(t.date); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear(); });
  } else if(state.range === 'year'){
    arr = arr.filter(t => new Date(t.date).getFullYear() === now.getFullYear());
  }
  return arr.sort((a,b)=> new Date(a.date) - new Date(b.date));
}

function computeStats(trades){
  const n = trades.length;
  const wins = trades.filter(t=>t.outClass==='win');
  const losses = trades.filter(t=>t.outClass==='loss');
  const bes = trades.filter(t=>t.outClass==='be');
  const grossWin = wins.reduce((s,t)=>s+t.pnl,0);
  const grossLoss = Math.abs(losses.reduce((s,t)=>s+t.pnl,0));
  const net = trades.reduce((s,t)=>s+t.pnl,0);
  const winRate = n ? (wins.length/n*100) : 0;
  const avgWin = wins.length ? grossWin/wins.length : 0;
  const avgLoss = losses.length ? grossLoss/losses.length : 0;
  const profitFactor = grossLoss>0 ? grossWin/grossLoss : (grossWin>0 ? Infinity : 0);
  const expectancy = n ? net/n : 0;
  const avgR = n ? trades.reduce((s,t)=>s+t.r,0)/n : 0;
  const best = n ? Math.max(...trades.map(t=>t.pnl)) : 0;
  const worst = n ? Math.min(...trades.map(t=>t.pnl)) : 0;

  let curStreak=0, curType=null, bestWinStreak=0, worstLossStreak=0, tmpW=0, tmpL=0;
  trades.forEach(t=>{
    if(t.outClass==='win'){ tmpW++; tmpL=0; bestWinStreak=Math.max(bestWinStreak,tmpW); }
    else if(t.outClass==='loss'){ tmpL++; tmpW=0; worstLossStreak=Math.max(worstLossStreak,tmpL); }
  });
  for(let i=trades.length-1;i>=0;i--){
    const o = trades[i].outClass;
    if(o==='be') break;
    if(curType===null){ curType=o; curStreak=1; }
    else if(o===curType){ curStreak++; }
    else break;
  }

  return { n, wins:wins.length, losses:losses.length, be:bes.length, net, winRate, avgWin, avgLoss,
    profitFactor, expectancy, avgR, best, worst, curStreak, curType, bestWinStreak, worstLossStreak,
    grossWin, grossLoss };
}
function groupBy(trades, keyFn){
  const map = {};
  trades.forEach(t=>{ const k = keyFn(t); if(!map[k]) map[k]=[]; map[k].push(t); });
  return map;
}
function statRow(label, t){
  const win = t.filter(x=>x.outClass==='win').length;
  const net = t.reduce((s,x)=>s+x.pnl,0);
  const avgR = t.length ? t.reduce((s,x)=>s+x.r,0)/t.length : 0;
  const wr = t.length ? (win/t.length*100) : 0;
  return {label, count:t.length, net, wr, avgR};
}

/* ============================= MONTHLY PERFORMANCE ============================= */
function monthKey(dateStr){ return dateStr.slice(0,7); } // 'YYYY-MM'
function monthLabel(key){
  const parts = key.split('-'); const y = parts[0]; const m = parseInt(parts[1],10);
  return MONTH_ABBR[m-1] + ' ' + y;
}
function monthlyStats(trades){
  const g = groupBy(trades, t=>monthKey(t.date));
  const keys = Object.keys(g).sort(); // 'YYYY-MM' sorts chronologically as a string
  return keys.map(k=>{
    const arr = g[k];
    const net = arr.reduce((s,t)=>s+t.pnl,0);
    const win = arr.filter(t=>t.outClass==='win').length;
    const wr = arr.length ? (win/arr.length*100) : 0;
    return { key:k, label: monthLabel(k), count: arr.length, net, wr };
  });
}
function renderBestMonthCard(trades){
  const monthly = monthlyStats(trades);
  if(!monthly.length) return `<p style="color:var(--text-faint);font-size:12.5px;">No data yet.</p>`;
  const best = [...monthly].sort((a,b)=>b.net-a.net)[0];
  return `
    <div class="lbl" style="font-size:11.5px;color:var(--text-dim);margin-bottom:6px;">Best month</div>
    <div class="num pos" style="font-size:22px;font-weight:800;">${best.label}</div>
    <div class="sub" style="font-size:12px;color:var(--text-faint);margin-top:4px;">${fmtMoney(best.net,true)} · ${best.count} trade${best.count===1?'':'s'} · ${fmtPct(best.wr)} win rate</div>
  `;
}
function renderMonthlyRanking(monthly){
  if(!monthly.length) return `<p style="color:var(--text-faint);font-size:12.5px;">No data yet.</p>`;
  const ranked = [...monthly].sort((a,b)=>b.net-a.net);
  return `<div class="table-scroll"><table><thead><tr><th>Rank</th><th>Month</th><th>Trades</th><th>Win rate</th><th>Net P&amp;L</th></tr></thead><tbody>
    ${ranked.map((m,i)=>`<tr>
      <td class="num">#${i+1}</td>
      <td>${m.label}</td>
      <td class="num">${m.count}</td>
      <td class="num">${fmtPct(m.wr)}</td>
      <td class="num ${colorForPnl(m.net)}" style="font-weight:700;">${fmtMoney(m.net,true)}</td>
    </tr>`).join('')}
  </tbody></table></div>`;
}
function drawMonthlyChart(monthly){
  chartDefaults(); destroyChart('monthly');
  const ctx = document.getElementById('chartMonthly'); if(!ctx) return;
  const gain = cssVar('--gain'), loss = cssVar('--loss');
  const data = monthly.map(m=>m.net);
  charts.monthly = new Chart(ctx, { type:'bar',

function categorySubtitle(cat){

  if(cat==='demo') return 'Demo account · every dollar your demo strategy has earned, kept in its own ledger';
  return 'Backtest account · every dollar your backtested strategy has earned, kept in its own ledger';

/* Always-visible strip showing every dollar earned, split into its own
   ledger — real, demo, and backtest each accumulate their own total and
   are never summed together. Clicking a card switches the whole page
   (KPIs, charts, tables) to that ledger. */
function renderCategoryOverviewCards(){
  const cats = ['real','demo','backtest'];
  const tag = { real:'Real account', demo:'Demo account', backtest:'Backtest account' };
  return `<div class="kpi-row" style="grid-template-columns:repeat(3,1fr);">
    ${cats.map(c=>{
      const arr = categoryTrades(c).map(withDerived);
      const net = arr.reduce((s,t)=>s+t.pnl,0);
      const active = state.category===c;
      return `<div class="kpi-card cat-card ${active?'active':''}" data-cat="${c}">
        <div class="tag">${tag[c]}</div>
        <div class="lbl">Total earned</div>
        <div class="val num ${colorForPnl(net)}">${fmtMoney(net,true)}</div>
        <div class="sub">${arr.length} trade${arr.length===1?'':'s'}</div>
      </div>`;
    }).join('')}
  </div>`;
}
function bindCategoryOverviewCards(){
  document.querySelectorAll('.cat-card').forEach(el=>{
    el.onclick = ()=>{
      state.category = el.dataset.cat;
      state.settings.lastCategory = state.category;
      renderMain();
      saveSettings();
    };
  });
}
/* Cumulative dollars earned over time within a single ledger — treats every
   trade's dollar P&L (win, loss, breakeven) as real earnings toward that
   ledger's running total. Ledgers are never mixed. */
function equityCurve(trades){
  let cum = 0;
  return trades.map(t=>{ cum += t.pnl; return { date: t.date, cum }; });
}
function drawEquityChart(trades, canvasId){
  chartDefaults(); destroyChart(canvasId);
  const ctx = document.getElementById(canvasId); if(!ctx) return;
  const curve = equityCurve(trades);
  const gain = cssVar('--gain'), loss = cssVar('--loss');
  const endsUp = curve.length ? curve[curve.length-1].cum >= 0 : true;
  const lineColor = endsUp ? gain : loss;
  charts[canvasId] = new Chart(ctx, { type:'line',
    data:{ labels: curve.map(p=>p.date), datasets:[{ data: curve.map(p=>p.cum), borderColor:lineColor, backgroundColor:lineColor+'22', fill:true, tension:.25, pointRadius:0, borderWidth:2.5 }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:(c)=>' '+fmtMoney(c.parsed.y)}}},
      scales:{ x:{grid:{display:false}, ticks:{maxTicksLimit:8, color:cssVar('--text-faint'),font:{size:10}}}, y:{grid:{color:cssVar('--border-soft')}, ticks:{callback:(v)=>'$'+v, color:cssVar('--text-faint'),font:{size:10.5}}} } } });
}
function navItem(tab, label, icon){
  return `<div class="nav-item ${state.activeTab===tab?'active':''}" data-tab="${tab}">${ICONS[icon]}<span>${label}</span></div>`;
}
function renderMain(){
  const main = document.getElementById('main');
  main.classList.remove('page-fade');
  void main.offsetWidth;
  main.classList.add('page-fade');
  if(state.activeTab==='dashboard') return renderDashboard(main);
  if(state.activeTab==='log') return renderLog(main);
  if(state.activeTab==='analytics') return renderAnalytics(main);
  if(state.activeTab==='calendar') return renderCalendar(main);
  if(state.activeTab==='settings') return renderSettings(main);
}

function emptyState(title, sub){ return `<div class="empty-state"><span class="serif">${title}</span><span>${sub}</span></div>`; }
function chartDefaults(){ Chart.defaults.font.family = "'Inter', sans-serif"; Chart.defaults.color = getComputedStyle(document.body).getPropertyValue('--text-dim'); }
function destroyChart(key){ if(charts[key]){ charts[key].destroy(); delete charts[key]; } }
function cssVar(name){ return getComputedStyle(document.body).getPropertyValue(name).trim(); }

function drawWLDonut(trades){
  chartDefaults(); destroyChart('wl');
  const ctx = document.getElementById('chartWL'); if(!ctx) return;
  const { wins, losses, be } = outcomeBreakdownCounts(trades);
  const gain = cssVar('--gain'), loss = cssVar('--loss'), dim = cssVar('--text-faint');
  charts.wl = new Chart(ctx, { type:'doughnut',
    data:{ labels:['Wins','Losses','Breakeven'], datasets:[{ data:[wins,losses,be], backgroundColor:[gain,loss,dim], borderWidth:0 }]},
    options:{ responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, boxHeight:10, padding:16, font:{size:11.5} } } } } });
}
function drawDowChart(trades, canvasId){
  chartDefaults(); destroyChart(canvasId);
  const ctx = document.getElementById(canvasId); if(!ctx) return;
  const order = [1,2,3,4,5,6,0];
  const g = groupBy(trades, t=>t.dow);
  const dataAll = order.map(d=>g[d]||[]);
  const hasWeekend = dataAll[5].length || dataAll[6].length;
  const useOrder = hasWeekend ? order : [1,2,3,4,5];
  const data = useOrder.map(d=> (g[d]||[]).reduce((s,t)=>s+t.pnl,0));
  const gain = cssVar('--gain'), loss = cssVar('--loss');
  charts[canvasId] = new Chart(ctx, { type:'bar',
    data:{ labels: useOrder.map(d=>DOW_SHORT[d]), datasets:[{ data, backgroundColor:data.map(v=>v>=0?gain:loss), borderRadius:5, maxBarThickness:44 }]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:(c)=>' '+fmtMoney(c.parsed.y)}}},
      scales:{ x:{grid:{display:false}}, y:{grid:{color:cssVar('--border-soft')}, ticks:{callback:(v)=>'$'+v, color:cssVar('--text-faint'),font:{size:10.5}}} } } });
}

/* ============================= TRADE LOG ============================= */
function renderLog(main){
  const f = state.logFilters;
  let trades = journalTrades().map(withDerived);
  if(f.symbol!=='all') trades = trades.filter(t=>t.symbol===f.symbol);
  if(f.outcome!=='all') trades = trades.filter(t=>t.outcome===f.outcome);
  if(f.model!=='all') trades = trades.filter(t=>t.model===f.model);
  if(state.journal==='live' && f.demo!=='all') trades = trades.filter(t=>t.demo===f.demo);
  if(f.search){
    const q = f.search.toLowerCase();
    trades = trades.filter(t => (t.po3||'').toLowerCase().includes(q) || (t.dol||'').toLowerCase().includes(q) || (t.psych||'').toLowerCase().includes(q) || (t.notes||'').toLowerCase().includes(q));
  }
  trades.sort((a,b)=>{
    let av=a[f.sortKey], bv=b[f.sortKey];
    if(f.sortKey==='date'){ av=new Date(a.date); bv=new Date(b.date); }
    if(av<bv) return f.sortDir==='asc'?-1:1;
    if(av>bv) return f.sortDir==='asc'?1:-1;
    return 0;
  });

  const totalInJournal = journalTrades().length;
  const isLive = state.journal==='live';

  main.innerHTML = `
    <div class="page-header">
      <div><h1 class="page-title">${JOURNAL_LABELS[state.journal]} log</h1><p class="page-subtitle">${trades.length} of ${totalInJournal} trades</p></div>
      <div class="header-actions">${journalSegmented()}<button class="btn-primary" id="btnAddTop">+ Log trade</button></div>
    </div>
    <div class="table-toolbar">
      <input type="search" id="fSearch" placeholder="Search PO3, liquidity, psych, notes…" value="${escapeHtml(f.search)}" style="width:240px;">
      <select id="fSymbol"><option value="all" ${f.symbol==='all'?'selected':''}>All symbols</option>${Object.keys(SYMBOLS).map(s=>`<option value="${s}" ${f.symbol===s?'selected':''}>${s}</option>`).join('')}</select>
      <select id="fModel"><option value="all" ${f.model==='all'?'selected':''}>All models</option>${MODELS.map(s=>`<option value="${s}" ${f.model===s?'selected':''}>${s}</option>`).join('')}</select>
      <select id="fOutcome"><option value="all" ${f.outcome==='all'?'selected':''}>All outcomes</option>${Object.keys(OUTCOMES).map(k=>`<option value="${k}" ${f.outcome===k?'selected':''}>${OUTCOMES[k].label}</option>`).join('')}</select>
      ${isLive ? `<select id="fDemo"><option value="all" ${f.demo==='all'?'selected':''}>All (real + demo)</option><option value="no" ${f.demo==='no'?'selected':''}>Real only</option><option value="yes" ${f.demo==='yes'?'selected':''}>Demo only</option></select>` : ''}
      ${totalInJournal ? `<button class="btn-ghost" id="btnExport" style="margin-left:auto;">Export CSV</button>` : ''}
    </div>
    ${trades.length===0 ? emptyState('No trades match', 'Try clearing filters or log a new trade.') : `
    <div class="table-scroll panel" style="padding:0;">
      <table class="table-wide">
        <thead><tr>
          <th data-k="date">Date</th><th data-k="time">Time</th><th>Day</th><th data-k="symbol">Pair</th><th data-k="rating">Rating</th>
          <th data-k="direction">Dir</th><th data-k="model">Model</th><th data-k="po3">PO3</th><th data-k="entryTf">Entry TF</th>
          <th data-k="outcome">Outcome</th>${isLive?'<th data-k="demo">Demo</th>':''}<th data-k="rr">RR</th><th data-k="pnl">P&amp;L</th>
          <th data-k="dol">Liquidity draw</th><th data-k="psych">Psych</th><th>Notes</th><th></th>
        </tr></thead>
        <tbody>
          ${trades.map(t=>`
            <tr data-id="${t.id}">
              <td class="num">${t.date}</td>
              <td class="num">${t.time||'—'}</td>
              <td>${DOW_SHORT[t.dow]}</td>
              <td>${t.symbol}</td>
              <td><span class="badge ${ratingClass(t.rating)}">${t.rating}</span></td>
              <td><span class="badge ${t.direction}">${t.direction==='long'?'Long':'Short'}</span></td>
              <td>${t.model}</td>
              <td class="num">${t.po3}</td>
              <td class="num">${t.entryTf}</td>
              <td><span class="badge ${outcomeMeta(t.outcome).class}">${outcomeMeta(t.outcome).label}</span></td>
              ${isLive?`<td><span class="badge ${t.demo==='yes'?'demo':'real'}">${t.demo==='yes'?'Demo':'Real'}</span></td>`:''}
              <td class="num">${rrLabel(t.rr)}</td>
              <td class="num ${colorForPnl(t.pnl)}" style="font-weight:600;">${fmtMoney(t.pnl,true)}</td>
              <td>${escapeHtml(t.dol||'—')}</td>
              <td class="psych-cell" title="${escapeHtml(t.psych||'')}">${escapeHtml(truncateWords(t.psych,10))}</td>
              <td class="notes-cell" title="${escapeHtml(t.notes||'')}">${escapeHtml(truncateWords(t.notes,10))}</td>
              <td><div class="row-actions">
                <button class="icon-btn" data-edit="${t.id}">${ICONS.edit}</button>
                <button class="icon-btn" data-del="${t.id}">${ICONS.trash}</button>
              </div></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
    `}
  `;
  bindJournalSegmented();
  document.getElementById('btnAddTop').onclick = ()=>openTradeModal();

  document.getElementById('fModel').onchange = (e)=>{ f.model=e.target.value; renderMain(); };
  document.getElementById('fOutcome').onchange = (e)=>{ f.outcome=e.target.value; renderMain(); };
  const demoSel = document.getElementById('fDemo'); if(demoSel) demoSel.onchange = (e)=>{ f.demo=e.target.value; renderMain(); };
  const exp = document.getElementById('btnExport'); if(exp) exp.onclick = exportCSV;
  main.querySelectorAll('th[data-k]').forEach(th=>{
    th.onclick = ()=>{ const k = th.dataset.k; if(f.sortKey===k) f.sortDir = f.sortDir==='asc'?'desc':'asc'; else { f.sortKey=k; f.sortDir='desc'; } renderMain(); };

function renderAllDimTables(trades){
  const keys = Object.keys(DIMENSIONS);

function renderDimTable(trades, dimKey){
  const dim = DIMENSIONS[dimKey];
  const g = groupBy(trades, dim.get);
  let labels = Object.keys(g);
  if(dim.order){ labels = dim.order.filter(l=>g[l]); Object.keys(g).forEach(l=>{ if(!labels.includes(l)) labels.push(l); }); }
  else if(dimKey==='rr'){ labels = labels.sort((a,b)=> parseFloat(a)-parseFloat(b)); }
  const rows = labels.map(l=>statRow(l, g[l]));
  if(!rows.length) return `<p style="color:var(--text-faint);font-size:12.5px;">No data yet.</p>`;
  return `<div class="table-scroll"><table><thead><tr><th>${dim.label}</th><th>Trades</th><th>Win rate</th><th>Net P&amp;L</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r.label}</td><td class="num">${r.count}</td><td class="num">${fmtPct(r.wr)}</td><td class="num ${colorForPnl(r.net)}" style="font-weight:600;">${fmtMoney(r.net,true)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function drawDimBarChart(trades, dimKey, canvasId, order){
  chartDefaults(); destroyChart(canvasId);

  const dim = DIMENSIONS[dimKey];
  const g = groupBy(trades, dim.get);
  const labels = order.filter(l=>g[l]);
  const data = labels.map(l=> g[l].reduce((s,t)=>s+t.pnl,0));
  const gain = cssVar('--gain'), loss = cssVar('--loss');

  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const monthName = first.toLocaleString('default',{month:'long'});

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){

      <div class="legend">

        <span class="sw" style="background:var(--surface-2);margin-left:10px;"></span> No trades

function mix(hexA, hexB, t){
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  const r = Math.round(a[0]+(b[0]-a[0])*t), g = Math.round(a[1]+(b[1]-a[1])*t), bl = Math.round(a[2]+(b[2]-a[2])*t);
  return `rgb(${r},${g},${bl})`;
}
function hexToRgb(hex){ hex=hex.replace('#',''); return [parseInt(hex.substr(0,2),16),parseInt(hex.substr(2,2),16),parseInt(hex.substr(4,2),16)]; }

function readAndCompressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 720;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = ()=>reject(new Error('bad image'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}

  };
  const jType = t.journalType==='backtest' ? 'backtest' : 'live';
  const imgState = { imgLow: t.imgLow||null, imgMid: t.imgMid||null, imgHigh: t.imgHigh||null };
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h2>${existing?'Edit trade':'Log a trade'}</h2><button class="close-x" id="modalClose">×</button></div>
      <div class="form-grid">
        <div class="form-field"><label>Date</label><input type="date" id="fDate" value="${t.date}"><span class="dow-hint" id="dowHint"></span></div>
        <div class="form-field"><label>Time</label>
          <div class="time-select-row">
            <select id="fTimeHour" aria-label="Hour">
              <option value="">--</option>
              ${Array.from({length:24},(_,i)=>String(i).padStart(2,'0')).map(h=>`<option value="${h}" ${(t.time||'').split(':')[0]===h?'selected':''}>${h}</option>`).join('')}
            </select>
            <span class="time-sep">:</span>
            <select id="fTimeMinute" aria-label="Minute">
              <option value="">--</option>
              ${Array.from({length:60},(_,i)=>String(i).padStart(2,'0')).map(mn=>`<option value="${mn}" ${(t.time||'').split(':')[1]===mn?'selected':''}>${mn}</option>`).join('')}
            </select>
          </div>
          <span class="tz-hint">Time zone: America/New York (Eastern Time)</span>
        </div>
        <div class="form-field"><label>Pair</label>
          <select id="fSymbolM">${Object.keys(SYMBOLS).map(s=>`<option value="${s}" ${t.symbol===s?'selected':''}>${s}</option>`).join('')}</select>
        </div>
        <div class="form-field"><label>Journal</label>
          <div class="toggle-row">
            <button type="button" class="toggle-btn ${jType==='live'?'active':''}" data-jtype="live">Trading</button>
            <button type="button" class="toggle-btn ${jType==='backtest'?'active':''}" data-jtype="backtest">Backtesting</button>
          </div>
        </div>
        <div class="form-field" id="demoFieldWrap" style="${jType==='backtest'?'display:none;':''}"><label>Demo trade</label>
          <div class="toggle-row">
            <button type="button" class="toggle-btn ${t.demo==='yes'?'active':''}" data-demo="yes">Demo</button>
            <button type="button" class="toggle-btn ${(t.demo||'no')==='no'?'active':''}" data-demo="no">Real money</button>
          </div>
        </div>
        <div class="form-field"><label>Rating</label>
          <select id="fRating">${RATINGS.map(r=>`<option value="${r}" ${t.rating===r?'selected':''}>${r}</option>`).join('')}</select>
        </div>
        <div class="form-field"><label>Direction</label>
          <div class="toggle-row">
            <button type="button" class="toggle-btn ${t.direction==='long'?'active':''}" data-dir="long">Long</button>
            <button type="button" class="toggle-btn ${t.direction==='short'?'active':''}" data-dir="short">Short</button>
          </div>
        </div>
        <div class="form-field"><label>PO3 used?</label>
          <div class="toggle-row">
            <button type="button" class="toggle-btn ${(t.po3Used||'yes')==='yes'?'active':''}" data-po3used="yes">Yes</button>
            <button type="button" class="toggle-btn ${t.po3Used==='no'?'active':''}" data-po3used="no">No</button>
          </div>
        </div>
        <div class="form-field" id="po3FieldWrap" style="${t.po3Used==='no'?'display:none;':''}"><label>PO3</label>
          <select id="fPo3">${PO3_WINDOWS.map(p=>`<option value="${p}" ${t.po3===p?'selected':''}>${p}</option>`).join('')}</select>
        </div>
        <div class="form-field"><label>Model</label>
          <select id="fModelM">${MODELS.map(m=>`<option value="${m}" ${t.model===m?'selected':''}>${m}</option>`).join('')}</select>
        </div>
        <div class="form-field"><label>Entry timeframe</label>
          <select id="fEntryTf">${TIMEFRAMES.map(tf=>`<option value="${tf}" ${t.entryTf===tf?'selected':''}>${tf}</option>`).join('')}</select>
        </div>
        <div class="form-field"><label>Risk per trade ($)</label>
          <input type="number" id="fRisk" min="0" step="0.01" value="${t.riskPerTrade!=null && t.riskPerTrade!=='' ? t.riskPerTrade : state.settings.defaultRiskPerTrade}">
        </div>
        <div class="form-field"><label>Risk : Reward (X : 1)</label>
          <div style="display:flex;align-items:center;gap:8px;">
            <input type="number" id="fRR" min="0.01" step="0.01" value="${t.rr}" style="flex:1;">
            <span style="color:var(--text-dim);font-weight:600;">: 1</span>
          </div>
        </div>
        <div class="form-field"><label>Outcome</label>
          <select id="fOutcomeM">${Object.keys(OUTCOMES).map(k=>`<option value="${k}" ${t.outcome===k?'selected':''}>${OUTCOMES[k].label}</option>`).join('')}</select>
        </div>
        <div class="form-field" id="beAdjFieldWrap" style="${(t.outcome==='be_win'||t.outcome==='be_loss')?'':'display:none;'}">
          <label>P&amp;L beyond breakeven ($)</label>
          <input type="number" id="fBeAdj" step="0.01" value="${t.beAdjustment!=null ? t.beAdjustment : ''}" placeholder="e.g. 12.50">
          <span class="tz-hint">If you closed at a small profit or loss instead of exactly breakeven (e.g. stop moved above/below entry), enter the amount here. Use a negative number for a small loss.</span>
        </div>
        <div class="form-field"><label>Draw on liquidity</label>
          <select id="fDol">${DOL_OPTIONS.map(o=>`<option value="${o}" ${t.dol===o?'selected':''}>${o}</option>`).join('')}</select>
        </div>
        <div class="form-field"><label>Psychology / mental state</label>
          <input type="text" id="fPsych" placeholder="e.g. calm, FOMO, revenge trade" value="${escapeHtml(t.psych||'')}">
        </div>
        <div class="form-field span2"><label>Notes</label>
          <textarea id="fNotes" rows="3" placeholder="Describe the setup, execution, what went right or wrong…">${escapeHtml(t.notes||'')}</textarea>
        </div>
        <div class="form-field span2"><label>Chart screenshots</label>
          <div class="img-upload-row">
            ${TF_SLOTS.map(s=>imgSlotHtml(s.key, s.label, imgState[s.key])).join('')}
          </div>
        </div>
        <div class="form-preview" id="livePreview"></div>
      </div>
      <div class="modal-foot">
        <button class="btn-secondary" id="modalCancel">Cancel</button>
        <button class="btn-primary" id="modalSave">${existing?'Save changes':'Log trade'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  let dirVal = t.direction;
  let jTypeVal = jType, demoVal = t.demo || 'no';
  let po3UsedVal = t.po3Used || 'yes';

  overlay.querySelectorAll('[data-dir]').forEach(b=>{
    b.onclick = ()=>{ dirVal = b.dataset.dir; overlay.querySelectorAll('[data-dir]').forEach(x=>x.classList.toggle('active', x===b)); };
  });
  overlay.querySelectorAll('[data-jtype]').forEach(b=>{
    b.onclick = ()=>{
      jTypeVal = b.dataset.jtype;
      overlay.querySelectorAll('[data-jtype]').forEach(x=>x.classList.toggle('active', x===b));
      document.getElementById('demoFieldWrap').style.display = jTypeVal==='backtest' ? 'none' : '';
    };
  });
  overlay.querySelectorAll('[data-demo]').forEach(b=>{
    b.onclick = ()=>{ demoVal = b.dataset.demo; overlay.querySelectorAll('[data-demo]').forEach(x=>x.classList.toggle('active', x===b)); };
  });
  overlay.querySelectorAll('[data-po3used]').forEach(b=>{
    b.onclick = ()=>{
      po3UsedVal = b.dataset.po3used;
      overlay.querySelectorAll('[data-po3used]').forEach(x=>x.classList.toggle('active', x===b));
      document.getElementById('po3FieldWrap').style.display = po3UsedVal==='no' ? 'none' : '';
    };
  });

  function bindImgSlot(key, label){
    const input = overlay.querySelector(`[data-imginput="${key}"]`);
    if(input) input.onchange = async (e)=>{
      const file = e.target.files[0]; if(!file) return;
      try{ imgState[key] = await readAndCompressImage(file); refreshImgSlot(key, label); }
      catch(err){ alert('Could not read that image.'); }
    };
    const rm = overlay.querySelector(`[data-imgremove="${key}"]`);
    if(rm) rm.onclick = ()=>{ imgState[key] = null; refreshImgSlot(key, label); };
    const thumb = overlay.querySelector(`.img-slot-thumb[data-view="${key}"]`);
    if(thumb) thumb.onclick = ()=> openImageLightbox(imgState[key]);
  }
  function refreshImgSlot(key, label){
    const el = document.getElementById('imgSlot_'+key);
    if(el) el.outerHTML = imgSlotHtml(key, label, imgState[key]);
    bindImgSlot(key, label);
  }
  TF_SLOTS.forEach(s=> bindImgSlot(s.key, s.label));

  function updateDowHint(){
    const dv = document.getElementById('fDate').value;
    document.getElementById('dowHint').textContent = dv ? DOW[dayOfWeek(dv)] : '';
  }
  function updateBeAdjVisibility(){
    const outcomeVal = document.getElementById('fOutcomeM').value;
    const wrap = document.getElementById('beAdjFieldWrap');
    wrap.style.display = (outcomeVal==='be_win' || outcomeVal==='be_loss') ? '' : 'none';
  }
  function updatePreview(){
    let rrv = parseFloat(document.getElementById('fRR').value); if(!rrv || rrv<0.01) rrv = 0.01;
    const risk = parseFloat(document.getElementById('fRisk').value)||0;
    const beAdj = parseFloat(document.getElementById('fBeAdj').value)||0;
    const draft = { outcome: document.getElementById('fOutcomeM').value, rr: rrv, beAdjustment: beAdj };
    const pnl = dollarPnl(Object.assign({}, draft, { riskPerTrade: risk }));
    document.getElementById('livePreview').innerHTML = `
      <div class="fp-item"><div class="fp-lbl">Est. P&amp;L</div><div class="fp-val ${colorForPnl(pnl)}">${fmtMoney(pnl,true)}</div></div>
      <div class="fp-item"><div class="fp-lbl">Day of week</div><div class="fp-val">${document.getElementById('fDate').value ? DOW[dayOfWeek(document.getElementById('fDate').value)] : '—'}</div></div>
    `;
  }
  updateDowHint(); updateBeAdjVisibility(); updatePreview();
  document.getElementById('fDate').oninput = ()=>{ updateDowHint(); updatePreview(); };
  document.getElementById('fOutcomeM').onchange = ()=>{ updateBeAdjVisibility(); updatePreview(); };
  document.getElementById('fBeAdj').oninput = updatePreview;
  document.getElementById('fRR').oninput = updatePreview;
  document.getElementById('fRisk').oninput = updatePreview;

  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalCancel').onclick = closeModal;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  document.getElementById('modalSave').onclick = async ()=>{
    const dateVal = document.getElementById('fDate').value;
    if(!dateVal){ alert('Please select a date.'); return; }
    let rrVal = parseFloat(document.getElementById('fRR').value);
    if(!rrVal || rrVal < 0.01) rrVal = 0.01;
    const riskVal = parseFloat(document.getElementById('fRisk').value)||0;
    const record = {
      id: existing ? existing.id : uid(),
      date: dateVal,
      time: (()=>{ const h=document.getElementById('fTimeHour').value, mn=document.getElementById('fTimeMinute').value; return (h && mn) ? `${h}:${mn}` : ''; })(),
      symbol: document.getElementById('fSymbolM').value,
      journalType: jTypeVal,
      demo: jTypeVal==='backtest' ? 'no' : demoVal,
      riskPerTrade: riskVal,
      rating: document.getElementById('fRating').value,
      direction: dirVal,
      po3Used: po3UsedVal,
      po3: po3UsedVal==='no' ? 'Not used' : document.getElementById('fPo3').value,
      model: document.getElementById('fModelM').value,
      entryTf: document.getElementById('fEntryTf').value,
      rr: rrVal,
      outcome: document.getElementById('fOutcomeM').value,
      beAdjustment: (document.getElementById('fOutcomeM').value==='be_win' || document.getElementById('fOutcomeM').value==='be_loss') ? (parseFloat(document.getElementById('fBeAdj').value)||0) : 0,
      dol: document.getElementById('fDol').value,
      psych: document.getElementById('fPsych').value.trim(),
      notes: document.getElementById('fNotes').value.trim(),
      imgLow: imgState.imgLow, imgMid: imgState.imgMid, imgHigh: imgState.imgHigh,
    };
    if(existing){ const idx = state.trades.findIndex(x=>x.id===existing.id); state.trades[idx] = record; }
    else { state.trades.push(record); }
    const journalChanged = record.journalType !== state.journal;
    if(journalChanged){ state.journal = record.journalType; state.settings.lastJournal = state.journal; }
    closeModal();
    render();
    saveTrades();
    if(journalChanged) saveSettings();
  };
  function closeModal(){ overlay.classList.add('closing'); setTimeout(()=> overlay.remove(), 160); }
}

/* ============================= MODAL: TRADE DETAIL ============================= */
function detailItem(label, val){
  return `<div class="detail-item"><div class="detail-item-lbl">${label}</div><div class="detail-item-val">${val}</div></div>`;
}
function detailImgCard(label, src){
  if(!src) return `<div class="detail-img-card"><div class="detail-img-lbl">${label}</div><div class="img-slot-empty">No image</div></div>`;
  return `<div class="detail-img-card"><div class="detail-img-lbl">${label}</div><img src="${src}" class="detail-img-thumb"></div>`;
}
function openTradeDetail(id){
  const raw = state.trades.find(x=>x.id===id);
  if(!raw) return;
  const t = withDerived(raw);
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'detailOverlay';
  overlay.innerHTML = `
    <div class="modal detail-modal">
      <div class="modal-head"><h2>${t.symbol} · ${t.date}</h2><button class="close-x" id="detailClose">×</button></div>
      <div class="detail-grid">
        ${detailItem('Journal', JOURNAL_LABELS[t.journalType])}
        ${t.journalType==='live' ? detailItem('Demo trade', t.demo==='yes'?'Yes':'No') : ''}
        ${detailItem('Time', t.time ? `${t.time} ET` : '—')}
        ${detailItem('Day of week', DOW[t.dow])}
        ${detailItem('Rating', `<span class="badge ${ratingClass(t.rating)}">${t.rating}</span>`)}
        ${detailItem('Direction', `<span class="badge ${t.direction}">${t.direction==='long'?'Long':'Short'}</span>`)}
        ${detailItem('Model', t.model)}
        ${detailItem('PO3', t.po3)}
        ${detailItem('Entry timeframe', t.entryTf)}
        ${detailItem('Outcome', `<span class="badge ${outcomeMeta(t.outcome).class}">${outcomeMeta(t.outcome).label}</span>`)}
        ${(t.outcome==='be_win'||t.outcome==='be_loss') ? detailItem('P&amp;L beyond breakeven', `<span class="${colorForPnl(parseFloat(t.beAdjustment)||0)}">${fmtMoney(parseFloat(t.beAdjustment)||0,true)}</span>`) : ''}
        ${detailItem('Risk : Reward', rrLabel(t.rr))}
        ${detailItem('Risk per trade', fmtMoney(tradeRisk(t)))}
        ${detailItem('P&amp;L', `<span class="${colorForPnl(t.pnl)}">${fmtMoney(t.pnl,true)}</span>`)}
        ${detailItem('Draw on liquidity', escapeHtml(t.dol||'—'))}
      </div>
      <div class="detail-block">
        <div class="detail-block-lbl">Psychology / mental state</div>
        <div class="detail-block-text">${escapeHtml(t.psych||'—')}</div>
      </div>
      <div class="detail-block">
        <div class="detail-block-lbl">Notes</div>
        <div class="detail-block-text">${escapeHtml(t.notes||'—')}</div>
      </div>
      <div class="detail-block">
        <div class="detail-block-lbl">Chart screenshots</div>
        <div class="detail-imgs">
          ${TF_SLOTS.map(s=>detailImgCard(s.label, t[s.key])).join('')}
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn-secondary" id="detailCloseBtn">Close</button>
        <button class="btn-primary" id="detailEditBtn">Edit trade</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = ()=>{ overlay.classList.add('closing'); setTimeout(()=> overlay.remove(), 160); };
  document.getElementById('detailClose').onclick = close;
  document.getElementById('detailCloseBtn').onclick = close;
  overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
  document.getElementById('detailEditBtn').onclick = ()=>{ close(); openTradeModal(id); };
  overlay.querySelectorAll('.detail-img-thumb').forEach(img=>{ img.onclick = ()=> openImageLightbox(img.src); });
}

/* ============================= INIT ============================= */
(async function init(){
  document.getElementById('app').innerHTML = `<div style="padding:40px;color:#86868b;">Loading journal…</div>`;
  await ensureAuth();
  document.getElementById('app').innerHTML = `<div style="padding:40px;color:#86868b;">Loading journal…</div>`;
  await loadData();
  render();
  subscribeRealtime();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
